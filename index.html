<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132D2B">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Avalon</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
<style>
:root {
  color-scheme: dark;
  --bg: #132d2b;
  --deep: #102623;
  --card: #1e3d39;
  --raised: #284944;
  --ink: #f6e8cd;
  --muted: #b8cabe;
  --line: #55776d;
  --gold: #f5d59a;
  --copper: #c49a55;
  --paper: #f1dcb3;
  --paper-ink: #2b2f28;
  --good: #c7ddc0;
  --evil: #f4ccc0;
  --hand: "LXGW WenKai", "霞鹜文楷", "KaiTi", "STKaiti", system-ui, sans-serif;
  --logo: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --radius: 12px;
  --shadow: 0 5px 18px #081b1977;
  --paper-texture: radial-gradient(ellipse at 26% 0%, #fff3d6 0%, transparent 72%),
    repeating-linear-gradient(112deg, #6c462509 0 1px, transparent 1px 5px);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--bg); scrollbar-gutter: stable; }
body {
  background: radial-gradient(ellipse at 50% 0%, #284640, var(--bg) 34rem, var(--deep)) fixed;
  color: var(--ink);
  font: 16px/1.48 var(--hand);
  min-height: 100vh;
}
body:has(.mask) { overflow: hidden; }
#app {
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
#app:has(.mebar) { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
p { margin-block: .65em; }
b, strong { color: var(--gold); }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.fun { font-weight: 700; }
.small { font-size: 14px; }
.center { text-align: center; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.stack > * + * { margin-top: 12px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 48px;
  padding: 8px 15px;
  border: 1px solid var(--copper);
  border-radius: 10px;
  color: #302414;
  background: var(--paper-texture), linear-gradient(#eed49f, #d8af70);
  box-shadow: inset 0 0 0 2px #794c272c, 0 2px 0 #76552e;
  font-weight: 700;
  font-size: 17px;
  line-height: 1.25;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .55; }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; padding: 6px 10px; font-size: 14px; }
.btn.white, .btn.ghost { background: #24413b; color: var(--ink); box-shadow: none; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--gold); }
.btn.red { background: #713e35; color: #fff0d8; box-shadow: inset 0 0 0 2px #f3ca9420; }
.btn.green { background: #d2e1c9; color: #23483b; border-color: #8daa88; box-shadow: inset 0 0 0 2px #35524420; }
.card {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(150deg, var(--raised), var(--card) 60%);
  box-shadow: inset 0 0 0 2px #afc6ac0d, var(--shadow);
}
.paper {
  --gold: #5e401e;
  --ink: var(--paper-ink);
  --muted: #4c5547;
  --line: #9c7b4e;
  color: var(--paper-ink);
  background: var(--paper-texture), var(--paper);
}
.paper :focus-visible { outline-color: #643b19; }
.paper .btn.white { color: #fff1d7; }
.paper .card { background: #fff0cf90; box-shadow: none; }
.ico { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; vertical-align: -.24em; margin-right: 4px; }
.btn .ico { margin-right: 0; flex: none; }
.ico svg, .ico img { width: 100%; height: 100%; object-fit: contain; }
.portrait {
  display: block; width: 100%; height: auto; aspect-ratio: 1;
  object-fit: cover; border-radius: 50%; color: transparent;
  background: radial-gradient(#7e6b52, #314640);
}
.av { display: block; width: 44px; flex: none; }
.logo { font: 900 20px/1 var(--logo); color: var(--gold); text-shadow: 0 2px 8px #101f1c; }
.navbar {
  position: sticky; top: 0; z-index: 4;
  display: flex; align-items: center; gap: 6px;
  min-height: 57px; margin: 0 0 10px; padding: 6px 0;
  background: #132d2bf7; border-bottom: 1px solid var(--line);
}
.navbar .mid { flex: 1; text-align: center; }
.navbar .btn { flex: none; white-space: nowrap; }
.game-nav .btn { padding-inline: 8px; }

/* 封面与入房 */
.home { max-width: 420px; margin: 9px auto 0; }
.home-cover, .home-form, .home-entry, .mebar {
  background:
    linear-gradient(#173734bf, #152f2ddb),
    #1d3c39 url("./assets/mist/lake-board-v2.jpg") center 72% / cover;
}
.illustration-frame {
  position: relative; isolation: isolate;
  border: 5px solid transparent; border-radius: 12px;
  background-clip: padding-box;
  box-shadow: 0 8px 24px #091b1999;
}
.illustration-frame::after {
  content: ""; position: absolute; inset: -6px; z-index: 3; pointer-events: none;
  border: 1px solid transparent;
  border-image: url("./assets/mist/ornaments/ragged-frame.webp") 10% / 22px stretch;
}
.home-cover { padding-bottom: 3px; }
.hero {
  position: relative;
  aspect-ratio: 2 / 3;
  background: #183a38;
}
.hero .scene {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: 11px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
.wordmark, .cover-crest { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }
.wordmark {
  display: block; width: 93%; height: auto; top: 4.1%;
  font: 700 61px "Cinzel", Georgia, serif; letter-spacing: 1.3px;
  filter: drop-shadow(0 3px 3px #102522b0);
}
.cover-crest { width: 37%; height: auto; top: 20%; }
.cover-actions {
  position: absolute; inset: auto 5.5% clamp(12px, 4vw, 20px);
  display: grid; gap: 9px;
}
.btn.plaque {
  --plaque-art: url("./assets/mist/ornaments/gilt-paper.webp");
  --plaque-fallback: linear-gradient(#edc88f, #d9a968);
  color: #352515; border: 1px solid transparent; border-radius: 7px;
  border-image: var(--plaque-art) 29% 12% fill / 28% 12% stretch;
  background: var(--plaque-fallback) center / calc(100% - 14px) calc(100% - 12px) no-repeat;
  box-shadow: none; filter: drop-shadow(0 2px 2px #0b211eb3);
}
.btn.imprint { min-height: 57px; font-size: 21px; }
.btn.imprint .ico { width: 24px; height: 24px; }
.home-form, .home-entry {
  margin: 3px 8px 0; padding: 10px;
  border: 1px solid #8c8e6e; border-radius: 5px;
  box-shadow: inset 0 0 0 2px #b29d6b20;
  border-image: url("./assets/mist/ornaments/ragged-frame.webp") 10% / 9px stretch;
}
.home-form label { color: #f1d6a3; }
.home-form { position: relative; }
.home-form::before, .home-form::after {
  content: ""; position: absolute; width: 24px; height: 14px; pointer-events: none;
  background: url("./assets/mist/crest-v2.png") left center / 77px auto no-repeat;
  opacity: .68;
}
.home-form::before { top: -2px; left: 3px; transform: rotate(23deg); }
.home-form::after { bottom: -1px; right: 3px; background-position: right center; transform: rotate(23deg); }
.home-form .av { width: 46px; }
.home-form .btn { flex: none; padding-inline: 7px; border-color: #a98b58; border-radius: 5px; background: #2b4541; }
.home-form input.field, .home-entry .digit {
  background: #2c4644; border-color: #9aa58a; color: #fff1d0;
  border-radius: 5px; box-shadow: inset 0 2px 3px #132d2a80;
}
.home-form input.field::placeholder { color: #cbd3bd; }
.home-form input.field:focus, .home-entry .digit:focus { border-color: #f5d59a; }
.home-form label, .field-label { display: block; margin-bottom: 3px; font-weight: 700; }
input.field, .digit {
  width: 100%; min-width: 0; min-height: 44px;
  border: 1px solid #709489; border-radius: 8px;
  background: var(--deep); color: var(--ink);
}
input.field { padding: 7px 8px; }
input.field::placeholder { color: var(--muted); }
.avatar-picker { max-width: 370px; }
.avatars {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px; margin-top: 14px;
}
.avatars button {
  position: relative; min-height: 44px; padding: 3px;
  border: 2px solid transparent; border-radius: 50%; background: transparent;
}
.avatars button.on { border-color: #915625; box-shadow: inset 0 0 0 2px #ac7c365e; }
.avatar-check, .team-mark {
  display: grid; place-items: center; position: absolute; right: 0; bottom: 0;
  width: 19px; height: 19px; border: 1px solid #794c25; border-radius: 50%;
  background: #f5d59a; color: #352616; font: 700 12px/1 system-ui;
}
.home-entry { margin-top: 8px; }
.home-tools { margin-top: 12px; }
.join-row { align-items: end; }
.join-row .btn { flex: none; }
.codebox { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.roomcode, .digit { font-family: "Cinzel", Georgia, serif; font-weight: 700; }
.digit { text-align: center; font-size: 21px; padding: 0; caret-color: var(--gold); }

/* 大厅 */
.roomcode { color: var(--gold); font-size: 46px; line-height: 1.1; letter-spacing: .18em; padding-left: .18em; }
.plist { list-style: none; padding: 0; margin: 5px 0 0; }
.plist li, .toggle { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #9fb6a633; }
.plist li:last-child, .toggle:last-child { border-bottom: 0; }
.plist .av, .toggle .av { width: 38px; }
.plist .mine .portrait { outline: 2px solid var(--copper); outline-offset: 1px; }
.seatno, .seatpick .n {
  display: grid; place-items: center; width: 27px; height: 27px; flex: none;
  border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font: 700 13px/1 system-ui;
}
.seatno.occupied, .seatpick .mine .n { border-color: var(--copper); color: var(--gold); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  padding: 1px 7px; border: 1px solid var(--line); border-radius: 20px; color: var(--ink); font-size: 13px;
}
.chip.good, .chip.green { background: var(--good); border-color: #70886b; color: #245344; }
.chip.evil { background: var(--evil); border-color: #b57b6f; color: #713b32; }
.chip.gold { color: var(--gold); border-color: var(--copper); }
.switch {
  position: relative; width: 48px; height: 44px; padding: 0;
  flex: none; border: 0; border-radius: 8px; background: transparent;
}
.switch::before, .switch::after { content: ""; position: absolute; }
.switch::before { inset: 9px 0; border: 1px solid #8ba99c; border-radius: 20px; background: var(--deep); }
.switch::after { width: 18px; height: 18px; inset: 13px auto auto 4px; border-radius: 50%; background: #bacabb; }
.switch.on::before { background: #416b54; border-color: var(--gold); }
.switch.on::after { left: 26px; background: var(--gold); }
.switch:disabled { opacity: .55; }
.comp { display: flex; flex-wrap: wrap; gap: 5px; }
.av.pair { width: 69px !important; display: flex; }
.av.pair img { width: 50%; }
.seatpick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
.seatpick button {
  display: grid; justify-items: center; align-content: center; gap: 4px; min-width: 0; min-height: 62px;
  padding: 4px 1px; border: 1px solid var(--line); border-radius: 8px; background: var(--deep);
}
.seatpick button.mine { border: 2px solid var(--copper); background: var(--raised); }
.seatpick .who { font-size: 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seatpick .free, .seatpick .taken { color: var(--muted); }

/* 任务轨道和水纹圆桌 */
.game-nav {
  margin: 0; padding-inline: 9px; border-bottom: 0;
  background: linear-gradient(#152f2cb8, #173432df),
    #1b3634 url("./assets/mist/lake-board-v2.jpg") center 53% / cover;
}
.game-nav .logo { font-family: "Cinzel", Georgia, serif; }
.game-nav .plaque { padding-inline: 13px; }
.game-menu { position: relative; }
.game-menu summary { list-style: none; cursor: pointer; }
.game-menu summary::-webkit-details-marker { display: none; }
.game-menu summary::after { content: "▾"; font-size: .8em; }
.game-menu[open] summary::after { content: "▴"; }
.game-menu .menu-links {
  position: absolute; right: 0; top: calc(100% + 5px); min-width: 125px;
  display: grid; gap: 5px; padding: 6px; border-radius: 10px;
}
.lake-board {
  max-width: 442px; margin: 0 auto; container-type: inline-size;
  background: #142f2d;
}
.lake-map {
  position: relative; isolation: isolate; aspect-ratio: 1122 / 1402;
  width: 100%; min-height: 423px;
}
.lake-board:not(:has(.lake-action-top)) .lake-map:not(.crowded, .dense, [data-players="6"]) {
  min-height: clamp(423px, min(155cqi, 100svh - 286px), 560px);
}
.lake-map.crowded { min-height: 474px; }
.lake-map[data-players="6"] { min-height: 555px; }
.lake-map[data-players="8"] { min-height: 525px; }
.lake-map.dense { min-height: 580px; }
.lake-art {
  position: absolute; z-index: -1; inset: 0; display: block;
  width: 100%; height: 100%; object-fit: fill;
  border-radius: 11px 11px 0 0;
}
.lake-map::after {
  content: ""; position: absolute; z-index: -1; inset: 86% 0 0; pointer-events: none;
  background: linear-gradient(transparent, #142f2d);
}
.progress {
  position: relative; z-index: 1; padding: clamp(13px, 5cqi, 23px) 8px 0;
  text-align: center; pointer-events: none;
}
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 2px; }
.qt { display: grid; justify-items: center; align-content: start; row-gap: 2px; font-size: 12px; line-height: 1.16; }
.qt::before {
  content: ""; display: block; width: clamp(41px, 14.6cqi, 58px); aspect-ratio: 1;
  border-radius: 45% 43% 24% 23%;
  background: var(--stone) center / contain no-repeat;
  filter: drop-shadow(0 2px 1px #142f2d85);
}
.qt:not(.ok,.bad)::before { filter: sepia(.48) saturate(1.2) brightness(1.08) drop-shadow(0 2px 1px #142f2d85); }
.qt.cur::before { filter: sepia(.55) saturate(1.3) brightness(1.12) drop-shadow(0 0 1px #f8d48b) drop-shadow(0 0 2px #d7a353); }
.qt-label, .qt .result, .qt .two, .qt .fails {
  padding: 2px 4px; border-radius: 4px; color: #36291c; background: #ecd5ae;
  white-space: nowrap;
}
.qt .result, .qt .two, .qt .fails { font-size: 11px; }
.qt-label { background: #ecd5ae url("./assets/mist/ornaments/torn-paper.webp") center / 123% 128%; }
.qt .result { font-weight: 700; }
.qt.cur .qt-label { outline: 1px solid #9b6a32; box-shadow: 0 0 0 1px #f1d7a5; }
.qt.ok .result { color: #24453a; background: #dae4c9; }
.qt.bad .result, .qt .two, .qt .fails { color: #642d23; background: #f0d4bb; }
.qt .stone-sign { font-family: system-ui; }
.step .rejects {
  display: inline-block; margin: 5px 0 0; padding: 2px 8px; border-radius: 12px;
  color: #4d432f; background: #b38b501c; font-size: 12px;
}
.step .danger { color: #762c23; background: #f3d1b3; font-weight: 700; }
.step { padding: 9px 11px; overflow-wrap: anywhere; }
.step h2 { font-size: 17px; color: var(--gold); }
.step p { margin: 3px 0 0; font-size: 14px; }
.step .danger { border-radius: 6px; }
.step .essential { font-weight: 700; }
.step .bigchoice { margin-top: 8px; }
.warn, .tip { font-size: 14px; padding: 7px 9px; border-radius: 8px; }
.warn { color: #ffdfd0; border: 1px solid #de9b86; background: #55362f; }
.tip { border: 1px dashed var(--copper); background: #c49a551c; }
.lake-action-top { margin: 8px; }
.lake-caption { position: relative; margin: -10px auto 0; width: fit-content; max-width: calc(100% - 18px); text-align: center; }
.lake-map.dense + .lake-caption { margin-top: -28px; }
.lake-caption .step {
  padding: 9px 17px; border-color: transparent; border-radius: 0; box-shadow: none;
  border-image: url("./assets/mist/ornaments/torn-paper.webp") 31% 12% fill / 25% 24px stretch;
  background: linear-gradient(#efce9a, #eac48a) center / calc(100% - 22px) calc(100% - 14px) no-repeat;
}
.lake-caption .step h2 { font-size: 17px; }
.table-submit { padding: 7px 17px 13px; }
.table-submit .btn.plaque {
  --plaque-art: url("./assets/mist/ornaments/gilt-red.webp");
  --plaque-fallback: linear-gradient(#823e36, #70342d);
  min-height: 49px; color: #fff0d4; font-size: 18px;
}
.table-submit .btn:disabled { opacity: .65; filter: saturate(.65); }
.lake-board:not(:has(.table-submit)) .lake-caption { margin-bottom: 13px; }
.lake-board:has(.lake-action-top) .lake-art { border-radius: 0 0 11px 11px; }
.game-seats {
  --face-size: clamp(56px, 21.2cqi, 78px);
  position: absolute; inset: 0;
}
.lake-map[data-players="6"] .game-seats { --face-size: clamp(54px, 20cqi, 74px); }
.crowded .game-seats { --face-size: clamp(53px, 18cqi, 66px); }
.dense .game-seats { --face-size: clamp(45px, 15.3cqi, 56px); }
.seat {
  position: absolute; left: var(--x); top: var(--y);
  transform: translate(-50%, calc(var(--face-size) / -2 - 3px));
  width: calc(var(--face-size) + 8px); min-height: 44px;
  padding: 2px; border: 1px solid transparent; border-radius: 12px;
  background: transparent; color: var(--ink); font: inherit; text-align: center;
}
.seat .face { position: relative; display: block; width: var(--face-size); margin: 0 auto 2px; }
.public-portrait, .seat .public-portrait { border: 1px solid #b49560; box-shadow: 0 0 0 1px #77928676, 0 2px 5px #0f2823a6; }
.seat .no, .seat .badge {
  position: absolute; display: grid; place-items: center;
  width: 20px; height: 20px; border: 1px solid #edcc8e; border-radius: 50%; background: #17332e;
}
.seat .no { left: -4px; top: -3px; color: var(--ink); font: 700 11px/1 system-ui; }
.seat .badge { width: 21px; height: 21px; right: -4px; top: -4px; }
.seat .badge svg { width: 15px; height: 13px; }
.seat .badge.lady { top: auto; bottom: 0; right: auto; left: -4px; color: var(--gold); font-size: 13px; }
.seat .nm {
  display: block; width: max-content; max-width: 100%; margin-inline: auto; padding: 1px 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-radius: 3px; background: #eed8ad url("./assets/mist/ornaments/torn-paper.webp") center / 124% 135%; color: #302b21; font-weight: 700;
  font-size: 14px; line-height: 1.25;
}
.seat .labels { display: flex; justify-content: center; gap: 2px; min-height: 0; margin-top: 2px; }
.seat .labels span { padding: 0 3px; border-radius: 4px; background: #142f2cf5; font-size: 10px; line-height: 14px; white-space: nowrap; }
.seat .leader { color: var(--gold); }
.seat .label-evil { color: var(--evil); }
.seat .label-done { color: var(--good); }
.seat.me .portrait { border-color: #fff0bf; }
.seat.pick .portrait, .seat.team .portrait { border-color: #f6d398; box-shadow: 0 0 0 2px #b2955d, 0 0 0 4px #54726b; }
.seat.dim .portrait { filter: saturate(.35) brightness(.68); }
.seat.dim .no { border-style: dashed; }
button.seat:hover .portrait { border-color: #fff0c8; }
button.seat:focus-visible { outline: 2px solid #fff1bf; outline-offset: 2px; }
.proposed {
  display: flex; flex-wrap: wrap; gap: 5px 6px; list-style: none; margin: 6px 0 0; padding: 0;
}
.proposed li {
  display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; padding: 2px 6px 2px 2px;
  border: 1px solid #a98a60; border-radius: 20px; background: #ffeacd; font-size: 13px; overflow-wrap: anywhere;
}
.proposed .av { width: 29px; }
.proposed .proposed-seat { color: #584a35; white-space: nowrap; }
.bigchoice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.bigchoice .btn { min-height: 50px; padding-inline: 5px; }
.bigchoice .symbol { width: 31px; height: 31px; }

const $app = document.getElementById('app');

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const room = () => S.state && S.state.room;

const meInfo = () => S.state && S.state.me;

let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2800);
}
async function act(fn, args, after){
  if(S.busy) return;
  S.busy = true; render();
  try{
    const out = await rpc(fn, args);
    if(after) await after(out);
    await refresh(true);
  }catch(e){
    if(e.message === 'NO_PLAYER'){ leaveLocal('房间已经不存在了'); }
    else toast(e.message);
  }finally{ S.busy = false; render(); }
}
function leaveLocal(msg){
  S.ids = []; store.set('avalon_test_ids', []);

/* ---------- 轮询 ---------- */
let requestId = 0, appliedId = 0;
async function refresh(force){
  if(!S.session) return;
  const session = S.session, id = ++requestId;
  try{
    const st = await rpc('avalon_state', { p_token: session.token });
    if(S.session !== session || id < appliedId) return;
    appliedId = id;
    const prev = S.state;
    S.state = st;
    S.loadError = '';
    detectEvents(prev, st);
    const sig = JSON.stringify(st);
    if(force || sig !== S.sig){ S.sig = sig; render(); }
  }catch(e){
    if(S.session !== session || id < appliedId) return;
    if(e.message === 'NO_PLAYER') leaveLocal('房间已经解散了');
    else if(!S.state && S.loadError !== e.message){ S.loadError = e.message; render(); }
  }
}
setInterval(() => { if(!document.hidden && !S.busy) refresh(false); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(false); });

function detectEvents(prev, st){
  const r = st.room;
  if(prev && (prev.room.game_no !== r.game_no || (r.status === 'lobby' && prev.room.status !== 'lobby'))){
    S.queue = [];
    if(S.modal?.type !== 'rules') S.modal = null;
    pendingConfirm = null;
    renderConfirm();
  }
  const seenKey = `avalon_seen_${r.code}_${r.game_no}_${String(S.session.token).slice(0, 8)}`;
  if(r.status === 'playing' && st.me.role && !store.get(seenKey, false)){
    store.set(seenKey, true);
    S.queue.push({ type:'night' });
  }
  if(prev && prev.room.code === r.code && prev.room.game_no === r.game_no){
    const pr = prev.room;
    if(r.history.length > pr.history.length) S.queue.push({ type:'vote', h: r.history[r.history.length-1] });
    if(r.quest_results.length > pr.quest_results.length) S.queue.push({ type:'quest', q: r.quest_results[r.quest_results.length-1] });
    if(r.lady_log.length > pr.lady_log.length) S.queue.push({ type:'lady', l: r.lady_log[r.lady_log.length-1] });
  }
  if(!S.modal && S.queue.length){ S.modal = S.queue.shift(); }
}
function closeModal(){
  S.modal = S.queue.length ? S.queue.shift() : null;

}

  </div></div>`;
  else html = testBar() + (room().status === 'lobby' ? viewLobby() : viewGame());
  if(html !== appMarkup){
    const focused = $app.contains(document.activeElement) ? controlKey(document.activeElement) : '';

    $app.innerHTML = html;

    if(gameMenu) gameMenu.open = menuWasOpen;
    appMarkup = html;
    findControl($app, focused)?.focus({ preventScroll:true });
  }
  renderModal();
}

function seatIssue(ps, n){
  if(n < 5) return '';
  const missing = ps.filter(p => !p.claimed).map(p => p.name);
  if(missing.length) return '还没选座位号：' + missing.map(esc).join('、');
  const bad = ps.filter(p => p.claimed > n);
  if(bad.length) return `现在 ${n} 个人，座位号只能是 1 到 ${n}。请 ${bad.map(p => esc(p.name)).join('、')} 重新选。`;
  return '';
}
function composition(n, s){
  const ev = EVIL_COUNT[n];
  if(!ev) return null;
  const good = ['merlin'], evil = ['assassin'];
  if(s.percival) good.push('percival');
  if(s.morgana) evil.push('morgana');
  if(s.mordred) evil.push('mordred');
  if(s.oberon) evil.push('oberon');
  if(evil.length > ev) return { error:`${n} 人局只有 ${ev} 个坏人（含刺客），特殊坏人选多了`, good, evil };
  while(good.length < n - ev) good.push('servant');
  while(evil.length < ev) evil.push('minion');
  return { good, evil };
}
function roleChips(list){
  const counts = {};
  list.forEach(r => counts[r] = (counts[r] || 0) + 1);
  return Object.keys(counts).map(r =>
    `<span class="chip ${ROLES[r].side}">${ROLES[r].name}${counts[r] > 1 ? ' ×' + counts[r] : ''}</span>`).join('');
}

function phaseView(){
  const r = room(), me = meInfo();
  const size = r.sizes[r.quest_no - 1];
  const needTwo = r.fails_needed[r.quest_no - 1] === 2;
  const questWarning = needTwo ? '<p class="essential">需 2 张失败牌才算失败</p>' : '';
  const lastChance = r.reject_count === 4 ? '<p class="danger">再否决一次，坏人获胜</p>' : '';

  if(r.phase === 'team_build'){
    const isLeader = me.seat === r.leader;
    return `
      <h2 class="fun"><span class="ico">${crown}</span>${isLeader ? `点座位选队员（${S.pick.length}/${size}）` : `${nm(r.leader)} 正在选 ${size} 名队员`}</h2>
      ${lastChance}${questWarning}`;
  }
  if(r.phase === 'team_vote'){
    const voted = players().filter(p => p.voted).length;
    const mv = me.my_vote;
    return `
      <h2 class="fun">组队表决 · 已投 ${voted} / ${r.n}</h2>
      <ul class="proposed" aria-label="拟议队伍">${r.team.map(seat => `<li><span class="av">${publicAvatar(P(seat)?.avatar)}</span><span class="proposed-seat">${seat + 1} 号</span><span>${nm(seat)}</span></li>`).join('')}</ul>
      ${lastChance}${questWarning}
      <div class="bigchoice">
        <button class="btn vote-yes ${mv === true ? 'sel' : ''}" data-act="vote" data-v="1" aria-pressed="${mv === true}" aria-disabled="${S.busy}">${symbol('vote-sun')}同意</button>
        <button class="btn vote-no ${mv === false ? 'sel' : ''}" data-act="vote" data-v="0" aria-pressed="${mv === false}" aria-disabled="${S.busy}">${symbol('vote-moon')}反对</button>
      </div>
      ${mv == null ? '' : `<p class="muted">你已投${mv ? '同意' : '反对'} · 表决结束前可改票</p>`}`;
  }
  if(r.phase === 'quest'){
    const inTeam = r.team.includes(me.seat);
    if(inTeam && !me.played){
      const good = me.side === 'good';
      return `
        <h2 class="fun">${I.sword}秘密出牌</h2>
        <p>${good ? '请遮住屏幕。好人只能出成功牌' : '请遮住屏幕再出牌'}</p>
        ${questWarning}
        <div class="bigchoice">
          <button class="btn" data-act="play" data-v="1" ${S.busy ? 'disabled' : ''}>${symbol('quest-success')}成功</button>
          <button class="btn red" data-act="play" data-v="0" ${good || S.busy ? 'disabled' : ''}>${symbol('quest-failure')}失败</button>
        </div>`;
    }
    const played = players().filter(p => p.played).length;
    return `
      <h2 class="fun">${inTeam ? '你已出牌' : '队员正在出牌'}（${played}/${r.team.length}）</h2>
      ${questWarning}`;
  }
  if(r.phase === 'lady'){
    const holder = r.lady_holder;
    return me.seat === holder ? `
      <h2 class="fun">${mirrorIcon}点座位查验阵营</h2>
      <p>灰色座位不可选，结果仅你可见</p>` : `
      <h2 class="fun">${mirrorIcon}${nm(holder)} 正在查验阵营</h2>`;
  }
  if(r.phase === 'assassin'){
    return me.role === 'assassin' ? `
      <h2 class="fun">${I.sword}点座位指认梅林</h2>
      <p>指认正确，坏人获胜</p>` : `
      <h2 class="fun">${I.sword}等待刺客指认梅林</h2>
      ${me.side === 'evil' ? '<p>坏人可公开讨论</p>' : ''}`;
  }
  return '';
}

function seatAction(p){
  const r = room(), me = meInfo();
  if(!p || !r || r.status !== 'playing') return '';
  if(r.phase === 'team_build' && me.seat === r.leader) return 'pick';
  if(p.seat === me.seat) return '';
  if(r.phase === 'lady' && me.seat === r.lady_holder && !r.lady_previous.includes(p.seat)) return 'lady';
  if(r.phase === 'assassin' && me.role === 'assassin' && !p.evil) return 'kill';
  return '';
}

function seatView(p, index, count){
  const r = room(), me = meInfo(), action = seatAction(p);
  const isMe = p.seat === me.seat;
  const leader = r.leader === p.seat && r.phase !== 'assassin';
  const holder = r.lady_enabled && r.lady_holder === p.seat;
  const picked = action === 'pick' && S.pick.includes(p.seat);
  const team = r.phase !== 'team_build' && r.team.includes(p.seat);
  const dim = !action && ((r.phase === 'lady' && me.seat === r.lady_holder) || (r.phase === 'assassin' && me.role === 'assassin'));
  const labels = [];
  if(isMe) labels.push(['', '我']);
  if(leader) labels.push(['leader', '队长']);
  if(r.phase === 'team_vote' && p.voted) labels.push(['label-done', '已投']);
  if(r.phase === 'quest' && team && p.played) labels.push(['label-done', '已出牌']);
  if(r.phase === 'assassin' && p.evil) labels.push(['label-evil', p.assassin ? '刺客' : '坏人']);
  const tag = action ? 'button' : 'div';
  const label = [`${p.seat + 1} 号 ${p.name}`, ...labels.map(([, name]) => name)];
  if(team || picked) label.push('已入队');
  if(holder) label.push('湖中仙女');
  // Match the centre of the painted ripples. Start with two seats across the upper shore.
  const angle = (index + .5) * 2 * Math.PI / count;
  const topPair = index === 0 || index === count - 1;
  const bottomPair = index === 3 || index === 4;
  const insetPair = (count === 7 && topPair) || (count === 8 && (topPair || bottomPair));
  const radiusX = count === 6 ? 38.5 : insetPair ? 28.6 : 37;
  const sideShoulder = count === 10 && (index % 5 === 1 || index % 5 === 3);
  const radiusY = sideShoulder ? 30.8 : count === 8 ? 27.4 : count >= 9 ? 26.4 : 24.3;
  const position = `--x:${(50 + radiusX * Math.sin(angle)).toFixed(3)}%;--y:${(56.6 - radiusY * Math.cos(angle)).toFixed(3)}%`;
  return `<${tag} class="seat ${isMe ? 'me' : ''} ${picked ? 'pick' : ''} ${team ? 'team' : ''} ${dim ? 'dim' : ''}"
    style="${position}" title="${esc(label.join(' · '))}" ${action ? `type="button" data-act="${action}" data-seat="${p.seat}" aria-label="${esc(label.join('，'))}" ${action === 'pick' ? `aria-pressed="${picked}"` : ''}` : ''}>
    <span class="face">
      ${publicAvatar(p.avatar)}<span class="no">${p.seat + 1}</span>
      ${leader ? `<span class="badge" aria-hidden="true">${crown}</span>` : ''}
      ${holder ? '<span class="badge lady" aria-label="湖中仙女" role="img">◈</span>' : ''}
      ${team || picked ? '<span class="team-mark" aria-label="已入队" role="img">✓</span>' : ''}
    </span>
    <span class="nm">${esc(p.name)}</span>
    <span class="labels">${labels.map(([cls, name]) => `<span class="${cls}">${name}</span>`).join('')}</span>
  </${tag}>`;
}

function questTrack(r){
  return Array.from({length: 5}, (_, i) => {
    const turn = i + 1, size = r.sizes[i];
    const res = r.quest_results.find(q => q.quest === turn);
    const current = turn === r.quest_no && r.phase !== 'assassin';
    const two = r.fails_needed[i] === 2;
    const cls = res ? (res.success ? 'ok' : 'bad') : (current ? 'cur' : '');
    const stone = res ? (res.success ? 'quest-success' : 'quest-failure') : 'quest-stone';
    return `<div class="qt ${cls}" style="--stone:url('${ASSET}${stone}.png')" ${current && !res ? 'aria-current="step"' : ''}>
      <span class="qt-label"><span class="sr-only">第 ${turn} 轮，</span><span aria-hidden="true">${turn} · </span>${size} 人</span>
      ${res ? `<b class="result"><span class="stone-sign" aria-hidden="true">${res.success ? '✓' : '✕'}</span> ${res.success ? '成功' : '失败'}</b>` : current ? '<b class="result">当前</b>' : ''}
      ${res && !res.success ? `<span class="fails">${res.fails} 张失败</span>` : ''}
      ${two ? '<span class="two">需 2 败</span>' : ''}
    </div>`;
  }).join('');
}

  return `

/* ---------- 弹窗 ---------- */
function roleCard(open){
  if(!open) return `
    <h2 class="fun">身份封存</h2>
    ${mirror('<span class="seal" aria-hidden="true">?</span>', 'role-portrait')}
    <p class="center muted">请独自查看</p>
    <button class="btn block" data-act="flip">${I.lock}查看身份</button>`;
  const me = meInfo(), ro = ROLES[me?.role];
  if(!ro) return '';
  const sees = me.sees || [];
  let know = '';
  if(me.role === 'merlin') know = sees.length
    ? `<p><b>你看到的坏人：</b></p><ul class="knows">${sees.map(x => `<li><span class="chip evil">坏人</span> ${x.seat+1} 号 ${nm(x.seat)}</li>`).join('')}</ul>${room().settings?.mordred ? '<p class="small muted">莫德雷德也在场，但你看不到他。</p>' : ''}`
    : '<p>你没看到任何坏人（他们都藏起来了）。</p>';
  else if(me.role === 'percival') know = `<p><b>${sees.length > 1 ? '其中一位是梅林，另一位是莫甘娜：' : '梅林是：'}</b></p><ul class="knows">${sees.map(x => `<li><span class="chip good">${sees.length > 1 ? '梅林？' : '梅林'}</span> ${x.seat+1} 号 ${nm(x.seat)}</li>`).join('')}</ul>`;
  else if(me.role === 'oberon') know = '<p>你看不到其他坏人，他们也看不到你。</p>';
  else if(ro.side === 'evil') know = sees.length
    ? `<p><b>你的坏人同伴：</b></p><ul class="knows">${sees.map(x => `<li><span class="chip evil">同伴</span> ${x.seat+1} 号 ${nm(x.seat)}</li>`).join('')}</ul>${room().settings?.oberon ? '<p class="small muted">奥伯伦也是坏人，但你不知道是谁。</p>' : ''}`
    : '<p>你没有看到同伴。</p>';
  else know = '<p class="muted">你没有额外信息，靠观察和推理吧。</p>';
  return `
    ${mirror(rolePortrait(me.role), 'role-portrait', 'revealed')}
    <h2 class="fun">${ro.name}</h2>
    <div class="center" style="margin-top:5px">${sideChip(ro.side)}</div>
    <div class="role-copy paper">
      <p>${ro.desc}</p>
      ${know}
    </div>`;
}

function mirror(content, cls = '', face = ''){
  return `<div class="mirror ${cls}">
    <img src="${ASSET}lady-mirror.png" alt="" width="244" height="340">
    <div class="mirror-content ${face}">${content}</div>
  </div>`;
}
const sideMark = side => side === 'good' ? '✦' : '◆';
const sideChip = side => `<span class="chip ${side}"><span aria-hidden="true">${sideMark(side)}</span> ${SIDE_NAME[side]}</span>`;
function ladyLoyalty(l){
  return l.holder === meInfo()?.seat && (l.loyalty === 'good' || l.loyalty === 'evil') ? l.loyalty : null;
}
const ladyTransfer = l => `${nm(l.holder)} 查验了 ${nm(l.target)}，湖中仙女已交给对方。`;
const voteTitle = h => h.approved ? '组队通过' : '组队被否决';
function voteBreakdown(h, reveal = false){
  const yes = h.votes.filter(Boolean).length;
  return `<div class="${reveal ? 'reveal-votes' : ''}">
    <p class="small"><span class="vote-mark yes">${symbol('vote-sun')}同意 ${yes}</span>
      <span class="vote-mark no">${symbol('vote-moon')}反对 ${h.votes.length - yes}</span></p>
    <ul class="vlist" aria-label="公开票型">${h.votes.map((vote, seat) => `<li>
      <span class="av">${publicAvatar(P(seat)?.avatar)}</span><span class="vote-seat">${seat + 1} 号</span>
      <span class="grow">${nm(seat)}</span>
      <span class="vote-mark ${vote ? 'yes' : 'no'}">${symbol(vote ? 'vote-sun' : 'vote-moon')}${vote ? '同意' : '反对'}</span>
    </li>`).join('')}</ul>
  </div>`;
}

let renderedModal = null, renderedOpen = false, modalReturn = '', renderedHistory = '';
function updateDialogLayers(){
  $app.inert = !!(S.modal || pendingConfirm);
  $modal.inert = !!pendingConfirm;
}
function renderModal(){
  const m = S.modal;
  if(!renderedModal && m && $app.contains(document.activeElement)){
    modalReturn = controlKey(document.activeElement);
  }
  updateDialogLayers();
  // An existing reveal stays mounted through room polls.
  if(m === renderedModal && !!m?.open === renderedOpen){
    if(m?.type === 'history'){
      const next = historyHtml();
      if(next !== renderedHistory){
        $modal.querySelector('.history-log').innerHTML = next;
        renderedHistory = next;
      }
    }
    return;
  }
  renderedModal = m;
  renderedOpen = !!m?.open;
  if(!m){
    $modal.replaceChildren();
    findControl($app, modalReturn)?.focus({ preventScroll:true });
    modalReturn = '';
    return;
  }

  let body = '';
  const r = room();
  if(m.type === 'night' || m.type === 'myrole'){
    body = `${m.type === 'night' ? `<p class="small muted center">第 ${r.game_no} 局开始</p>` : ''}${roleCard(m.open)}
      ${m.type === 'night' ? '<button class="btn white block" data-act="close">我记住了</button>' : m.open ? '<button class="btn block" data-act="close">收起身份</button>' : '<button class="btn white block" data-act="close">关闭</button>'}`;
  } else if(m.type === 'vote'){
    const h = m.h;
    body = `
      <h2 class="fun">${voteTitle(h)}</h2>
      <p class="center small">第 ${h.quest} 个任务 · 队长 ${nm(h.leader)}<br>队伍：${names(h.team)}</p>
      ${voteBreakdown(h, true)}
      <button class="btn block" data-act="close">知道了</button>`;
  } else if(m.type === 'quest'){
    const q = m.q;
    body = `
      <h2 class="fun">${q.success ? '任务成功' : '任务失败'}</h2>
      <p class="center">第 ${q.quest} 个任务 · ${q.needed === 2 ? '需 2 张失败牌' : '需 1 张失败牌'}才算失败</p>
      <div class="qcards">
        <div class="qc s">${symbol('quest-success')}${q.team.length - q.fails} 张成功</div>
        <div class="qc f">${symbol('quest-failure')}${q.fails} 张失败</div>
      </div>
      <button class="btn block" data-act="close">知道了</button>`;
  } else if(m.type === 'lady'){
    const l = m.l, side = ladyLoyalty(l);
    body = side ? `
      <h2 class="fun">查验结果</h2>
      <p class="center">查验了 <b>${nm(l.target)}</b></p>
      ${mirror(`<span class="side-mark" aria-hidden="true">${sideMark(side)}</span><span>${SIDE_NAME[side]}</span>`, '', `${side} revealed`)}
      <p class="center small muted">仅你可见 · 湖中仙女已交给 ${nm(l.target)}</p>
      <button class="btn block" data-act="close">知道了</button>` : `
      <h2 class="fun">${mirrorIcon}湖中仙女</h2>
      <p class="center">${ladyTransfer(l)}</p>
      <button class="btn block" data-act="close">知道了</button>`;
  } else if(m.type === 'history'){
    const rl = r?.settings?.roles || [];
    renderedHistory = historyHtml();
    body = `<h2 class="fun">${I.scroll}本局记录</h2>${rl.length ? `<p class="center small">本局角色</p><div class="comp" style="justify-content:center">${roleChips(rl)}</div>` : ''}<div class="history-log">${renderedHistory}</div><button class="btn block white" data-act="close">关闭</button>`;
  } else if(m.type === 'avatars'){
    body = avatarPicker();
  } else if(m.type === 'rules'){
    body = rulesHtml() + '<button class="btn block white" data-act="close">关闭</button>';
  }
  const paper = ['vote', 'quest', 'history', 'rules', 'avatars'].includes(m.type);
  $modal.innerHTML = `<div class="mask" data-act="maskclose"><div class="sheet ${paper ? 'paper' : ''} ${m.type === 'avatars' ? 'avatar-picker' : ''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${body}</div></div>`;
  const heading = $modal.querySelector('h2');
  if(heading){
    heading.id = 'dialog-title';
    heading.tabIndex = -1;
    if(!pendingConfirm) heading.focus({ preventScroll:true });
  }
}

function historyHtml(){
  const r = room();
  let html = '';
  for(let q = 1; q <= 5; q++){
    const hs = r.history.filter(h => h.quest === q);
    const res = r.quest_results.find(x => x.quest === q);
    const scans = r.lady_log.filter(l => l.quest === q);
    if(!hs.length && !res && !scans.length) continue;
    html += `<section class="card" style="margin-top:10px"><h3>第 ${q} 个任务</h3>
      ${res ? `<p class="small"><b>${res.success ? '成功' : '失败'}</b> · ${res.team.length - res.fails} 张成功 · ${res.fails} 张失败${res.needed === 2 ? ' · 需 2 败' : ''}</p>` : ''}`;
    hs.forEach(h => {
      html += `<div class="hist"><b>第 ${h.attempt} 次 · ${voteTitle(h)}</b>
        <div class="small">队长 ${nm(h.leader)} · 队伍：${names(h.team)}</div>
        ${voteBreakdown(h)}</div>`;
    });
    scans.forEach(l => {
      const side = ladyLoyalty(l);
      html += `<div class="hist small">${mirrorIcon}${ladyTransfer(l)}${side ? ` <span>仅你可见 ${sideChip(side)}</span>` : ''}</div>`;
    });
    html += '</section>';
  }
  return html || '<p class="center muted">还没有记录。</p>';
}

function rulesHtml(){
  return `<div class="rules">
  <h2 class="fun">${I.book}Avalon 规则</h2>
  <h3>目标</h3>
  <p><b>好人</b>：让 3 个任务成功，并且在最后不让刺客找到梅林。<br><b>坏人</b>：让 3 个任务失败；或者连续 5 次组队都被否决；或者在好人成功 3 次后由刺客刺中梅林。</p>
  <h3>人数配置</h3>
  <table><tr><th>人数</th><th>好人</th><th>坏人</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
  ${[5,6,7,8,9,10].map(n => `<tr><td>${n}</td><td>${n - EVIL_COUNT[n]}</td><td>${EVIL_COUNT[n]}</td>${TEAM_SIZES[n].map((x, i) => `<td>${x}${i === 3 && n >= 7 ? '*' : ''}</td>`).join('')}</tr>`).join('')}
  </table>
  <p class="small">1–5 列是每个任务需要的人数。* 7 人及以上的第 4 个任务需要 <b>2 张失败牌</b> 才算失败。</p>
  <h3>开局（夜晚）</h3>
  <ul><li>梅林看到所有坏人，但看不到莫德雷德。</li><li>派西维尔看到梅林和莫甘娜，分不清谁是谁。</li><li>坏人互相认识，但不认识奥伯伦；奥伯伦也不认识他们。</li></ul>
  <p class="small muted">这个 App 里不用闭眼：每个人在自己手机上看身份即可。</p>
  <h3>每一轮</h3>
  <ol>
    <li><b>组队</b>：队长挑出本轮人数的队员（可以选自己）。大家可以讨论。</li>
    <li><b>投票</b>：所有人同时投同意或反对，公开每个人的票。<b>超过半数</b>同意才通过，平票算否决。</li>
    <li>否决：队长顺时针交给下一位，重新组队。<b>连续 5 次否决，坏人直接获胜。</b></li>
    <li><b>执行任务</b>：通过后，队员秘密出牌。好人只能出成功，坏人可以出成功或失败。只公布失败牌数量，不公布是谁出的。</li>
    <li>有 1 张失败牌任务就失败（*的任务需要 2 张）。之后队长顺时针轮换，进入下一个任务。</li>
  </ol>
  <h3>刺杀梅林</h3>
  <p>好人完成 3 个任务后，坏人亮明身份一起讨论，由刺客指认一名好人。指中梅林，坏人获胜；否则好人获胜。</p>
  <h3>湖中仙女（可选，7 人以上）</h3>
  <p>开局交给第一位队长右手边的玩家。第 2、3、4 个任务结束后，持有者查验一名玩家的阵营（只有他知道结果，可以说谎），然后把湖中仙女交给被查验者。拿过湖中仙女的人不能被查验。</p>
  </div>`;
}

/* ---------- 测试模式 ---------- */
function testBar(){
  if(!S.test || !S.state) return '';
  const r = room(), ps = players(), cur = S.session.token;
  const byName = n => S.ids.find(x => x.name === n);
  const seatId = seat => { const p = P(seat); return p ? byName(p.name) : null; };
  let actor = null, actorWhy = '';
  if(r.phase === 'team_build'){ actor = seatId(r.leader); actorWhy = '队长'; }
  if(r.phase === 'lady'){ actor = seatId(r.lady_holder); actorWhy = '湖中仙女'; }
  if(r.phase === 'assassin'){ const a = ps.find(p => p.assassin); actor = a ? byName(a.name) : null; actorWhy = '刺客'; }
  const acts = [];
  if(r.status === 'lobby'){
    if(ps.length < 10) acts.push(`<button data-act="taddone">+ 加 1 个假玩家</button>`);
    if(ps.length < 5) acts.push(`<button data-act="taddfill">补满 5 人</button>`);
    acts.push(`<button data-act="tseats">一键分配座位号</button>`);
  }
  if(r.phase === 'team_vote'){
    acts.push(`<button data-act="tvote" data-v="1">其他人都投同意</button>`);
    acts.push(`<button data-act="tvote" data-v="0">其他人都投反对</button>`);
  }
  if(r.phase === 'quest') acts.push(`<button data-act="tplay">其他队员都出成功</button>`);
  if(r.status === 'playing' && hostId()) acts.push(`<button data-act="abort">提前结束本局</button>`);
  if(actor && actor.token !== cur) acts.push(`<button data-act="tswitch" data-t="${actor.token}">切到${actorWhy}（${esc(actor.name)}）</button>`);
  return `<div class="testbar">
    <div class="row"><b class="grow" style="color:#fff">${I.flask}测试模式 · 现在操作的是：${esc(meInfo().name)}</b></div>
    <fieldset class="test-controls" aria-label="测试操作" ${S.busy ? 'disabled' : ''}>
      <div class="ids">${S.ids.map(x => `<button class="${x.token === cur ? 'on' : ''}" data-act="tswitch" data-t="${x.token}">${esc(x.name)}</button>`).join('')}</div>
      ${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}
    </fieldset>
  </div>`;
}
function hostId(){
  const h = players().find(p => p.host);
  return h ? S.ids.find(x => x.name === h.name) : null;
}
function saveIds(){ store.set('avalon_test_ids', S.ids); }
function rememberMain(){
  if(S.test && S.session && !S.ids.find(x => x.token === S.session.token)){
    S.ids.unshift({ name: S.me.name.trim(), token: S.session.token }); saveIds();
  }
}
async function addFake(){
  const used = new Set(players().map(p => p.name).concat(S.ids.map(x => x.name)));
  let k = 1; while(used.has('测试' + k)) k++;
  const out = await rpc('avalon_join', { p_code: room().code, p_name: '测试' + k, p_avatar: (k * 5) % AV_N });
  S.ids.push({ name: '测试' + k, token: out.token }); saveIds();
}
async function others(fn, argsFor, ids = S.ids){
  const cur = S.session.token;
  for(const x of ids){ if(x.token === cur) continue; try{ await rpc(fn, argsFor(x)); }catch(e){} }
}
async function tbusy(job){
  if(S.busy) return; S.busy = true; render();
  try{ await job(); await refresh(true); }
  catch(e){ toast(e.message); await refresh(true); }
  finally{ S.busy = false; render(); }
}

/* ---------- 确认框 ---------- */
let pendingConfirm = null;
function ask(msg, okLabel, fn, danger){ pendingConfirm = { msg, okLabel, fn, danger }; renderConfirm(); }
let confirmReturn = '';
function renderConfirm(){
  if(!pendingConfirm){
    const hadConfirm = $confirm.hasChildNodes();
    $confirm.replaceChildren();
    updateDialogLayers();
    if(hadConfirm){
      const target = S.modal ? $modal.querySelector('#dialog-title') : findControl($app, confirmReturn);
      target?.focus({ preventScroll:true });
    }
    confirmReturn = '';
    return;
  }
  confirmReturn = controlKey(document.activeElement);
  updateDialogLayers();
  const c = pendingConfirm;
  $confirm.innerHTML = `<div class="mask confirm-mask"><div class="sheet paper" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <p class="center" id="confirm-title" style="font-size:20px;margin:6px 0 18px">${esc(c.msg)}</p>
    <div class="row"><button class="btn white grow" data-act="cfno">取消</button>
    <button class="btn ${c.danger ? 'red' : ''} grow" data-act="cfyes">${esc(c.okLabel)}</button></div>
  </div></div>`;
  $confirm.querySelector('[data-act="cfno"]').focus({ preventScroll:true });
}

/* ---------- 交互 ---------- */
function readInputs(){
  const ni = document.getElementById('nameInput'); if(ni) S.me.name = ni.value;
  const ds = document.querySelectorAll('.digit'); if(ds.length) S.joinCode = Array.from(ds).map(d => d.value.replace(/[^0-9]/g, '') || ' ').join('');
  store.set('avalon_me', S.me);
}
function enterRoom(out){
  S.session = { code: out.code, token: out.token };
  S.loadError = '';
  store.set('avalon_session', S.session);
  S.ids = []; saveIds(); rememberMain();
  S.state = null; S.sig = '';
}
const actions = {
  avatars(){
    readInputs();
    S.modal = { type:'avatars' };
    renderModal();
  },
  avatar(d){
    const id = Number(d.i);
    if(!AVATAR_CHOICES.includes(id)) return;
    readInputs();
    S.me.avatar = id;
    store.set('avalon_me', S.me);
    closeModal();
    render();
  },
  togglejoin(){
    readInputs();
    S.joinOpen = !S.joinOpen;
    render();
    if(S.joinOpen) $app.querySelector('.digit')?.focus();
  },
  create(){
    readInputs();
    const name = S.me.name.trim();
    if(!name){ toast('先填一下你的名字'); document.getElementById('nameInput')?.focus(); return; }
    act('avalon_create_room', { p_name: name, p_avatar: avatarId(S.me.avatar) }, enterRoom);
  },
  join(){
    readInputs();
    const name = S.me.name.trim();
    if(!name){ toast('先填一下你的名字'); document.getElementById('nameInput')?.focus(); return; }
    if(!/^\d{4}$/.test(S.joinCode)){ toast('房间号是 4 位数字'); $app.querySelector('.digit')?.focus(); return; }
    act('avalon_join', { p_code: S.joinCode, p_name: name, p_avatar: avatarId(S.me.avatar) }, enterRoom);
  },
  leave(){
    const me = meInfo();
    const isEnded = room() && room().status === 'ended';
    const msg = me && me.host && !isEnded ? '你是房主，离开会解散整个房间。确定吗？' : '确定离开房间吗？';
    ask(msg, me && me.host && !isEnded ? '解散并离开' : '离开', async () => {
      const token = S.session && S.session.token;
      const canRemove = me && room() && room().status !== 'playing';
      leaveLocal();
      if(token && canRemove){ try{ await rpc('avalon_remove', { p_token: token, p_seat: me.seat }); }catch(e){} }
    }, true);
  },
  claim(d){
    const num = +d.n, mine = (players().find(p => p.seat === meInfo().seat) || {}).claimed;
    act('avalon_claim_seat', { p_token: S.session.token, p_num: mine === num ? null : num });
  },
  cfno(){ pendingConfirm = null; renderConfirm(); },
  abort(){
    const tok = meInfo().host ? S.session.token : (hostId() || {}).token;
    if(!tok){ toast('只有房主可以提前结束游戏'); return; }
    ask('提前结束这一局？会公布所有人的身份，然后可以回到大厅重新开始。', '结束本局', () => act('avalon_abort', { p_token: tok }), true);
  },
  testmode(){ readInputs(); S.test = !S.test; store.set('avalon_test', S.test); render(); toast(S.test ? '测试模式已开启' : '测试模式已关闭'); },
  taddone(){ tbusy(addFake); },
  taddfill(){ tbusy(async () => { const need = 5 - players().length; for(let i = 0; i < need; i++) await addFake(); }); },
  tseats(){ tbusy(async () => {
    for(const x of S.ids){ try{ await rpc('avalon_claim_seat', { p_token: x.token, p_num: null }); }catch(e){} }
    let i = 0; for(const x of S.ids){ i++; try{ await rpc('avalon_claim_seat', { p_token: x.token, p_num: i }); }catch(e){} }
  }); },
  tvote(d){ tbusy(() => others('avalon_vote', x => ({ p_token: x.token, p_approve: d.v === '1' }))); },
  tplay(){
    const waiting = new Set(players().filter(p => room().team.includes(p.seat) && !p.played).map(p => p.name));
    const ids = S.ids.filter(x => waiting.has(x.name));
    tbusy(() => others('avalon_quest_play', x => ({ p_token: x.token, p_success: true }), ids));
  },
  tswitch(d){
    if(S.busy || d.t === S.session.token) return;
    S.session = { code: room().code, token: d.t }; store.set('avalon_session', S.session);
    S.state = null; S.sig = ''; S.queue = []; S.modal = null; S.pick = []; S.pickKey = ''; S.loadError = '';
    pendingConfirm = null; renderConfirm();
    render(); refresh(true);
  },
  cfyes(){ const f = pendingConfirm && pendingConfirm.fn; pendingConfirm = null; renderConfirm(); if(f) f(); },
  share(){
    const url = location.origin + location.pathname + '?room=' + room().code;
    if(navigator.share) navigator.share({ title:'Avalon', text:`来玩 Avalon！房间号 ${room().code}`, url }).catch(() => {});
    else if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('链接已复制'), () => toast(url));
    else toast(url);
  },
  kick(d){
    const p = P(+d.seat);
    ask(`把 ${p ? p.name : ''} 移出房间？`, '移出', () => act('avalon_remove', { p_token: S.session.token, p_seat: +d.seat }), true);
  },
  set(d){
    if(!meInfo().host) return;
    S.settings[d.k] = !S.settings[d.k];
    store.set('avalon_settings', S.settings); render();
  },
  rec(){
    const n = players().length;
    if(!REC[n]) return;
    Object.assign(S.settings, REC[n]);
    store.set('avalon_settings', S.settings); render();
    toast('已按 ' + n + ' 人局常用配置设置');
  },
  start(){
    act('avalon_start', { p_token: S.session.token, p_settings: { ...S.settings, lady: S.settings.lady && players().length >= 7 } });
  },
  pick(d){
    const seat = +d.seat;
    if(seatAction(P(seat)) !== 'pick') return;
    const size = room().sizes[room().quest_no - 1];
    const i = S.pick.indexOf(seat);
    if(i >= 0) S.pick.splice(i, 1);
    else if(S.pick.length < size) S.pick.push(seat);
    else toast(`这个任务只需要 ${size} 人，先取消一个`);
    render();
  },
  propose(){ act('avalon_propose', { p_token: S.session.token, p_team: S.pick }); },
  vote(d){ act('avalon_vote', { p_token: S.session.token, p_approve: d.v === '1' }); },
  play(d){
    const go = () => act('avalon_quest_play', { p_token: S.session.token, p_success: d.v === '1' });
    if(d.v === '0') ask('确定出「失败」牌吗？', '出失败牌', go, true); else go();
  },
  lady(d){
    const p = P(+d.seat);
    if(seatAction(p) !== 'lady') return;
    ask(`查验 ${p ? p.name : ''} 的阵营？`, '查验', () => {
      if(seatAction(P(p.seat)) === 'lady') act('avalon_lady', { p_token: S.session.token, p_target: p.seat });
    });
  },
  kill(d){
    const p = P(+d.seat);
    if(seatAction(p) !== 'kill') return;
    ask(`最终指认 ${p ? p.name : ''} 是梅林？这个决定不能撤回。`, '刺杀', () => {
      if(seatAction(P(p.seat)) === 'kill') act('avalon_assassinate', { p_token: S.session.token, p_target: p.seat });
    }, true);
  },
  again(){ act('avalon_back_to_lobby', { p_token: S.session.token }); },
  myrole(){ S.modal = { type:'myrole', open:false }; renderModal(); },
  flip(){
    if(S.modal?.type !== 'night' && S.modal?.type !== 'myrole') return;
    S.modal.open = true;
    renderModal();
  },
  history(){ S.modal = { type:'history' }; renderModal(); },
  rules(){ readInputs(); S.modal = { type:'rules' }; renderModal(); },
  close(){ closeModal(); },
  maskclose(d, el, e){ if(e.target === el && S.modal && S.modal.type !== 'night') closeModal(); }
};
document.addEventListener('click', e => {
  const menu = $app.querySelector('.game-menu[open]');
  if(menu && !menu.contains(e.target)) menu.open = false;
  const el = e.target.closest('[data-act]');
  if(!el || el.getAttribute('aria-disabled') === 'true') return;
  if(el.type === 'submit' && el.form?.id === 'join-form') return;
  const fn = actions[el.dataset.act];
  if(fn) fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'join-form') return;
  e.preventDefault();
  actions.join();
});
document.addEventListener('keydown', e => {
  const dialog = (pendingConfirm ? $confirm : $modal).querySelector('.sheet');
  if(dialog){
    if(e.key === 'Escape'){
      if(pendingConfirm) actions.cfno();
      else if(S.modal.type !== 'night') closeModal();
      e.preventDefault();
    } else if(e.key === 'Tab'){
      const buttons = Array.from(dialog.querySelectorAll('button:not(:disabled)'));
      const first = buttons[0], last = buttons.at(-1);
      if(!buttons.includes(document.activeElement) || document.activeElement === (e.shiftKey ? first : last)){
        (e.shiftKey ? last : first)?.focus();
        e.preventDefault();
      }
    }
    return;
  }
  const menu = e.target.closest('.game-menu[open]');
  if(e.key === 'Escape' && menu){
    menu.open = false;
    menu.querySelector('summary').focus();
    e.preventDefault();
  }
  if(!e.target.classList || !e.target.classList.contains('digit')) return;
  const ds = document.querySelectorAll('.digit'), i = +e.target.dataset.i;
  if(e.key === 'Backspace' && !e.target.value && i > 0){ ds[i - 1].focus(); ds[i - 1].value = ''; e.preventDefault(); }
  if(e.key === 'ArrowLeft' && i > 0) ds[i - 1].focus();
  if(e.key === 'ArrowRight' && i < 3) ds[i + 1].focus();
});
document.addEventListener('input', e => {
  if(!e.target.classList || !e.target.classList.contains('digit')) return;
  const ds = document.querySelectorAll('.digit'), v = e.target.value.replace(/[^0-9]/g, '');
  let i = +e.target.dataset.i;
  if(v.length > 1){ for(const ch of v){ if(i > 3) break; ds[i].value = ch; i++; } }
  else { e.target.value = v; if(v) i++; }
  if(i <= 3 && v) ds[i].focus();
  if(i > 3) ds[3].blur();
});
document.addEventListener('paste', e => {
  if(!e.target.matches('.digit')) return;
  e.preventDefault();
  const digits = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
  if(!digits) return;
  const fields = Array.from(document.querySelectorAll('.digit'));
  const start = digits.length >= fields.length ? 0 : +e.target.dataset.i;
  const end = Math.min(start + digits.length, fields.length);
  for(let i = start; i < end; i++) fields[i].value = digits[i - start];
  fields[Math.min(end, fields.length - 1)].focus();
});
document.addEventListener('focusin', e => { if(e.target.classList && e.target.classList.contains('digit')) e.target.select(); });

/* ---------- 启动 ---------- */
(function init(){
  const q = new URLSearchParams(location.search).get('room');
  if(q){
    S.joinCode = q.replace(/[^0-9]/g, '').slice(0, 4);
    S.joinOpen = true;
  }
  render();
  if(S.session) refresh(true);
})();
</script>
</body>
