<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1638">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Avalon</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
<style>
:root{
  --bg:#1B1638; --card:#272050; --card2:#30285F; --ink:#F3E9D2; --ink2:#B4A9D6;
  --line:rgba(201,162,74,.75); --gold:#FFD66B; --gold2:#E0A92E; --goldline:#C9A24A;
  --good:#5B86F5; --good-l:rgba(91,134,245,.24); --evil:#E5535B; --evil-l:rgba(229,83,91,.24);
  --gold-l:rgba(255,214,107,.15); --green:#3DB37A; --green-l:rgba(61,179,122,.22); --muted:rgba(255,255,255,.1);
  --r:20px; --shadow:0 6px 18px rgba(0,0,0,.35);
  --hand:"LXGW WenKai","霞鹜文楷","KaiTi","STKaiti",serif;
  --logo:"Cinzel Decorative","Cinzel",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3A2F72 0%,#1B1638 55%,#130F29 100%) fixed;
  color:var(--ink);font-family:var(--hand);font-size:18px;line-height:1.5;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
    radial-gradient(1.2px 1.2px at 20px 30px,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 120px 80px,#fff 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 200px 150px,#FFE9A8 50%,transparent 51%),
    radial-gradient(1px 1px at 60px 190px,#fff 50%,transparent 51%),
    radial-gradient(1.3px 1.3px at 170px 230px,#fff 50%,transparent 51%);
  background-size:240px 260px;animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.35}to{opacity:.8}}
#app,#modal,#confirm{position:relative;z-index:1}
.fun{font-family:var(--hand);font-weight:700;letter-spacing:.5px}
.small{font-size:16px}
#app{max-width:560px;margin:0 auto;padding:12px 16px 110px}
h1,h2,h3{margin:0}
b,strong{color:#FFE7A6}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1.5px solid #8A6417;border-radius:16px;background:linear-gradient(#FFE08A,#E0A92E);color:#2A1E05;
  padding:12px 18px;font-weight:700;font-size:20px;box-shadow:0 4px 0 #7A5410,0 8px 18px rgba(0,0,0,.3);
  transition:transform .08s, box-shadow .08s;min-height:52px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7A5410}
.btn[disabled]{opacity:.4;pointer-events:none;filter:saturate(.5)}
.btn.block{width:100%}
.btn.blue{background:linear-gradient(#7FA2FF,#4F7BF0);color:#fff;border-color:#2C4FB0;box-shadow:0 4px 0 #2C4FB0,0 8px 18px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(#FF7E85,#D9424B);color:#fff;border-color:#9A2830;box-shadow:0 4px 0 #9A2830,0 8px 18px rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(#5FD39A,#2E9C67);color:#fff;border-color:#1F6E48;box-shadow:0 4px 0 #1F6E48,0 8px 18px rgba(0,0,0,.3)}
.btn.white{background:rgba(255,255,255,.04);color:var(--gold);border-color:var(--goldline);box-shadow:none}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:12px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--gold);text-decoration:underline;min-height:auto;padding:6px}
.card{background:linear-gradient(180deg,rgba(48,40,95,.96),rgba(39,32,80,.96));border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),inset 0 0 0 4px rgba(201,162,74,.08);padding:16px}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--ink2)}
.center{text-align:center}
input.field{
  width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid #6B5FA0;
  border-radius:14px;background:#120E28;color:var(--ink);outline:none;
}
input.field::placeholder{color:#7D72A8}
input.field:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,214,107,.18)}
input.code{letter-spacing:8px;text-align:center;font-size:24px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;background:rgba(255,255,255,.06);white-space:nowrap;color:var(--ink)}
.chip.good{background:var(--good-l);color:#C2D3FF;border-color:#5B86F5}
.chip.evil{background:var(--evil-l);color:#FFB8BC;border-color:#E5535B}
.chip.gold{background:var(--gold-l);color:var(--gold)}
.chip.green{background:var(--green-l);color:#9BEBC2;border-color:#3DB37A}
.chibi{display:block;width:100%;height:auto;overflow:visible}
.logo{font-family:var(--logo);font-weight:900;color:var(--gold);letter-spacing:1px;text-shadow:0 0 18px rgba(255,200,80,.5),0 3px 0 #7A5410;line-height:1}

/* 页眉 */
.navbar{display:flex;align-items:center;gap:8px;margin:0 -16px 14px;padding:10px 16px;background:rgba(19,15,41,.75);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);position:sticky;top:0;z-index:4}
.navbar .logo{font-size:24px}
.navbar .mid{flex:1;text-align:center}

/* 首页 */
.hero{text-align:center;padding:10px 0 0;position:relative}
.hero .logo{font-size:60px;margin-top:34px}
.hero .moon{position:absolute;top:6px;right:8px;width:46px;filter:drop-shadow(0 0 12px rgba(255,226,154,.6))}
.divider{display:block;width:200px;margin:8px auto 0}
.table-scene{position:relative;height:250px;margin-top:4px}
.table-scene .ch{position:absolute;animation:bob 3.2s ease-in-out infinite}
.table-scene .ch:nth-child(2){animation-delay:-.6s}.table-scene .ch:nth-child(3){animation-delay:-1.2s}
.table-scene .ch:nth-child(4){animation-delay:-1.8s}.table-scene .ch:nth-child(5){animation-delay:-2.4s}
.table-scene .tbl{position:absolute;left:50%;transform:translateX(-50%);top:118px;width:340px;max-width:100%}
.table-scene .glow{position:absolute;left:50%;top:120px;width:120px;height:80px;transform:translateX(-50%);background:radial-gradient(rgba(255,200,90,.45),transparent 70%);animation:flick 2.4s ease-in-out infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1.2s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.table-scene .ch:nth-child(2) .eyes{animation-delay:-1.5s}.table-scene .ch:nth-child(4) .eyes{animation-delay:-3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes flame{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.12)}}
@keyframes flick{0%,100%{opacity:.85}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avatars button{border:1.5px solid transparent;border-radius:14px;background:rgba(255,255,255,.05);padding:2px}
.avatars button.on{border-color:var(--gold);background:var(--gold-l);box-shadow:0 0 12px rgba(255,214,107,.35)}

/* 大厅 */
.roomcode{font-size:46px;letter-spacing:12px;text-align:center;line-height:1.1;color:var(--gold);text-shadow:0 0 14px rgba(255,200,80,.4)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--muted)}
.plist li:last-child{border-bottom:none}
.plist .av{width:44px;flex:none}
.seatno{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:var(--gold-l);color:var(--gold);font-size:15px}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--muted)}
.toggle:last-child{border-bottom:none}
.toggle .av{width:46px;flex:none}
.switch{width:52px;height:30px;border-radius:999px;border:1.5px solid #6B5FA0;background:#120E28;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#B4A9D6;transition:left .15s,background .15s}
.switch.on{background:var(--green);border-color:#2E9C67}
.switch.on::after{left:25px;background:#fff}
.switch[disabled]{opacity:.4}
.comp{display:flex;flex-wrap:wrap;gap:6px}

/* 游戏 */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qt{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#3A3172,#241D4C);position:relative;font-size:22px;color:var(--ink)}
.qt small{font-size:12px;line-height:1;color:var(--ink2)}
.qt.cur{background:radial-gradient(#FFE08A,#E0A92E);color:#2A1E05;box-shadow:0 0 0 4px rgba(255,214,107,.2),0 0 18px rgba(255,214,107,.45);border-color:#8A6417}
.qt.cur small{color:#5A4210}
.qt.ok{background:radial-gradient(#7FA2FF,#4F7BF0);color:#fff;border-color:#2C4FB0}
.qt.bad{background:radial-gradient(#FF7E85,#D9424B);color:#fff;border-color:#9A2830}
.qt.ok small,.qt.bad small{color:#fff}
.qt .two{position:absolute;bottom:-9px;background:var(--evil);color:#fff;border-radius:8px;font-size:11px;padding:0 5px;line-height:16px}
.rejects{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:15px;color:var(--ink2)}
.rejects i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;background:#120E28}
.rejects i.on{background:var(--evil);border-color:var(--evil);box-shadow:0 0 8px rgba(229,83,91,.6)}
.rejects i.last{border-style:dashed}
.step{border-color:var(--gold);box-shadow:var(--shadow),0 0 0 4px rgba(255,214,107,.08),0 0 24px rgba(255,214,107,.12)}
.step .kicker{font-size:15px;color:var(--ink2);letter-spacing:1px}
.step h2{font-size:26px;margin:2px 0 6px;color:var(--gold)}
.step p{margin:0}
.warn{background:var(--evil-l);border:1.5px solid var(--evil);border-radius:12px;padding:8px 12px;color:#FFC2C5;font-size:15px}
.tip{background:var(--gold-l);border:1.5px dashed var(--gold2);border-radius:12px;padding:8px 12px;font-size:15px}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.seat{position:relative;border:1.5px solid var(--line);border-radius:16px;background:var(--card2);padding:6px 4px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .12s}
.seat .av{width:100%;max-width:64px;margin:0 auto}
.seat .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .no{position:absolute;top:-8px;left:-6px;width:22px;height:22px;border-radius:50%;background:#1B1638;border:1.5px solid var(--gold);color:var(--gold);font-size:12px;display:grid;place-items:center}
.seat .badges{position:absolute;top:-10px;right:-6px;display:flex;gap:2px}
.seat .badges span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:#1B1638}
.seat.me{background:linear-gradient(rgba(255,214,107,.22),var(--card2));border-color:var(--gold)}
.seat.team{background:linear-gradient(rgba(91,134,245,.35),var(--card2));border-color:var(--good)}
.seat.pick{background:linear-gradient(#7FA2FF,#4F7BF0);color:#fff;border-color:#C2D3FF;transform:translateY(-4px);box-shadow:0 0 16px rgba(91,134,245,.6)}
.seat.pickable{cursor:pointer}
.seat.dim{opacity:.35}
.seat.evil{background:linear-gradient(rgba(229,83,91,.38),var(--card2));border-color:var(--evil)}
.seat .st{font-size:13px;margin-top:2px}
.seat .st.yes{color:#7FE0AE}
.seat .st.wait{color:var(--ink2)}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigchoice .btn{min-height:84px;font-size:22px;flex-direction:column;gap:0}
.bigchoice .btn small{font-size:13px;opacity:.9}
.bigchoice .btn.sel{outline:3px solid var(--gold);outline-offset:3px}
.qcard{min-height:150px!important;border-radius:18px!important}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.mebar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(19,15,41,.94);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:5}
.mebar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mebar .av{width:46px;flex:none}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(8,6,20,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:600px){.mask{align-items:center}}
.sheet{background:linear-gradient(180deg,#2B2358,#1E1840);width:100%;max-width:520px;max-height:92vh;overflow:auto;border:1.5px solid var(--gold);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
@media (min-width:600px){.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h2{font-size:26px;text-align:center;color:var(--gold)}
.flip{perspective:900px;cursor:pointer}
.flip .inner{display:grid;transition:transform .5s;transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .face{grid-area:1/1;min-height:300px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--gold);border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.flip .back{background:radial-gradient(circle at 50% 40%,#3A2F72,#17122F);color:var(--ink);box-shadow:inset 0 0 0 6px rgba(201,162,74,.15)}
.flip .back .seal{width:96px;height:96px;border-radius:50%;background:radial-gradient(#FFE08A,#E0A92E);border:2px solid #8A6417;display:grid;place-items:center;font-size:44px;color:#2A1E05;font-family:var(--logo);box-shadow:0 0 24px rgba(255,214,107,.45)}
.flip .front{transform:rotateY(180deg);background:var(--card2);justify-content:flex-start}
.flip .front.good{background:linear-gradient(rgba(91,134,245,.45),var(--card2) 55%)}
.flip .front.evil{background:linear-gradient(rgba(229,83,91,.45),var(--card2) 55%)}
.rolebig{width:150px;margin:0 auto}
.knows{width:100%;text-align:left;margin-top:8px;padding-left:20px}
.knows li{margin:4px 0}
.qcards{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px 0}
.qc{width:64px;height:90px;border-radius:12px;border:1.5px solid var(--gold);display:grid;place-items:center;font-size:17px;animation:pop .35s both}
.qc.s{background:linear-gradient(#7FA2FF,#4F7BF0);color:#fff}
.qc.f{background:linear-gradient(#FF7E85,#D9424B);color:#fff}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.vlist div{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px dashed var(--muted);padding:3px 0;font-size:15px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:linear-gradient(#FFE08A,#E0A92E);color:#2A1E05;padding:10px 16px;border-radius:14px;z-index:40;max-width:90vw;text-align:center;animation:up .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hist{border-left:2px solid var(--line);padding-left:12px;margin:8px 0}
.hist .h{color:var(--ink)}
.endbanner{text-align:center;padding:20px 12px;border-radius:24px;border:1.5px solid var(--gold);box-shadow:var(--shadow)}
.endbanner.good{background:linear-gradient(rgba(91,134,245,.5),var(--card) 70%)}
.endbanner.evil{background:linear-gradient(rgba(229,83,91,.5),var(--card) 70%)}
.endbanner h1{font-size:40px;color:var(--gold)}
.rolesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.rolesgrid .rc{border:1.5px solid var(--line);border-radius:16px;background:var(--card2);padding:6px;text-align:center}
.rolesgrid .rc.good{background:linear-gradient(rgba(91,134,245,.35),var(--card2))}
.rolesgrid .rc.evil{background:linear-gradient(rgba(229,83,91,.35),var(--card2))}
.rolesgrid .rc .av{width:70px;margin:0 auto}
.rules h3{margin-top:16px;font-size:19px;color:var(--gold)}
.rules p,.rules li{font-size:16px}
.rules table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.rules td,.rules th{border:1px solid var(--line);padding:4px;text-align:center;background:rgba(255,255,255,.04)}
.rules th{background:var(--gold-l);color:var(--gold)}
.ico{display:inline-block;width:1.25em;height:1.25em;vertical-align:-0.22em;margin-right:4px}
.ico svg{width:100%;height:100%;display:block;overflow:visible}
.seat .badges span svg{width:18px;height:18px}
.av.pair{width:86px!important;display:flex}
.av.pair>svg{width:50%}
.testbar{background:#0F0B22;color:#fff;border-radius:16px;padding:10px 12px;margin-bottom:14px;border:1.5px dashed var(--gold)}
.testbar .ids{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.testbar .ids button{border:1.5px solid #B4A9D6;border-radius:999px;background:transparent;color:#fff;padding:2px 10px;font-size:14px}
.testbar .ids button.on{background:var(--gold);color:#2A1E05;border-color:var(--gold)}
.testbar .acts{display:flex;flex-wrap:wrap;gap:6px}
.testbar .acts button{border:1.5px solid var(--gold);border-radius:10px;background:#2B2358;color:var(--gold);padding:4px 10px;font-size:14px}
.loading{display:grid;place-items:center;min-height:60vh}
.seatpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.seatpick button{border:1.5px solid var(--line);border-radius:14px;background:var(--card2);padding:6px 2px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.seatpick button .n{font-size:26px;line-height:1;font-family:var(--logo);color:var(--gold)}
.seatpick button .who{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.seatpick button.mine{background:linear-gradient(#7FA2FF,#4F7BF0);color:#fff;border-color:#C2D3FF;box-shadow:0 0 14px rgba(91,134,245,.55)}
.seatpick button.mine .n{color:#fff}
.seatpick button.taken{background:rgba(255,255,255,.04);color:var(--ink2);opacity:.6}
.seatpick button.taken .n{color:var(--ink2)}
.seatpick button.free .who{color:var(--ink2)}
.roomcode,input.code,.navbar .code{font-family:"Cinzel",Georgia,serif!important;font-weight:700!important}
</style>
</head>

/* ---------- 后端 ---------- */
async function rpc(fn, args){
  let res;
  try{
    res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify(args || {})
    });
  }catch(e){ throw new Error('连不上服务器，请检查网络'); }
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok) throw new Error((data && data.message) || '出错了，请重试');
  return data;
}

function star(x, y, r, fill){
  let d = '';
  for(let i=0;i<10;i++){
    const a = Math.PI/5*i - Math.PI/2, rr = i%2 ? r*0.45 : r;
    d += (i?'L':'M') + (x + rr*Math.cos(a)).toFixed(1) + ' ' + (y + rr*Math.sin(a)).toFixed(1);
  }
  return `<path d="${d}Z" fill="${fill}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`;
}
function eyesSvg(kind){
  if(kind === 'none') return '';

    <ellipse cx="72" cy="62" rx="4.6" ry="5.6" fill="#2B2235"/><circle cx="73.6" cy="59.6" r="1.7" fill="#fff"/>`;
  if(kind === 'happy') return `<path d="M43 63 Q48 57 53 63 M67 63 Q72 57 77 63" fill="none" stroke="#2B2235" stroke-width="3" stroke-linecap="round"/>`;
  const col = kind === 'red' ? '#D9364A' : '#2B2235';
  const e = `<g class="eyes"><ellipse cx="48" cy="62" rx="4.6" ry="5.6" fill="${col}"/><ellipse cx="72" cy="62" rx="4.6" ry="5.6" fill="${col}"/>
    <circle cx="49.6" cy="59.6" r="1.7" fill="#fff"/><circle cx="73.6" cy="59.6" r="1.7" fill="#fff"/></g>`;
  const brows = (kind === 'evil' || kind === 'red')

function avatarSvg(i){

  if(i >= 6) return AVATARS_EXTRA[i - 6]();
  const hair = HAIRS[i % 6], body = BODIES[(i + 2) % 6], acc = ACCS[i];
  let hat = '', front = '';
  if(acc === 1) hat = `<g transform="translate(84 34)"><path d="M0 0 L-12 -8 L-12 8Z" fill="#FF7A99" ${sw}/><path d="M0 0 L12 -8 L12 8Z" fill="#FF7A99" ${sw}/><circle r="4" fill="#FF9DB0" ${sw}/></g>`;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2800);
}
async function act(fn, args, after){
  if(S.busy) return;
  S.busy = true; render();
  try{
    const out = await rpc(fn, args);
    if(after) await after(out);
    await refresh(true);
  }catch(e){
    if(e.message === 'NO_PLAYER'){ leaveLocal('房间已经不存在了'); }
    else toast(e.message);
  }finally{ S.busy = false; render(); }
}
function leaveLocal(msg){
  S.ids = []; store.set('avalon_test_ids', []);
  S.session = null; S.state = null; S.sig = ''; S.queue = []; S.modal = null;
  store.del('avalon_session'); if(msg) toast(msg); render();
}

/* ---------- 轮询 ---------- */
async function refresh(force){
  if(!S.session) return;
  const tok = S.session.token;
  try{
    const st = await rpc('avalon_state', { p_token: tok });
    if(!S.session || S.session.token !== tok) return;
    const prev = S.state;
    S.state = st;
    detectEvents(prev, st);
    const sig = JSON.stringify(st);
    if(force || sig !== S.sig){ S.sig = sig; render(); }
  }catch(e){
    if(e.message === 'NO_PLAYER' && S.session && S.session.token === tok) leaveLocal('房间已经解散了');
  }
}
setInterval(() => { if(!document.hidden && !S.busy) refresh(false); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(false); });

function detectEvents(prev, st){
  const r = st.room;
  const seenKey = `avalon_seen_${r.code}_${r.game_no}_${String(S.session.token).slice(0, 8)}`;
  if(r.status !== 'lobby' && st.me.role && !store.get(seenKey, false)){
    store.set(seenKey, true);
    S.queue.push({ type:'night' });
  }
  if(prev && prev.room.code === r.code && prev.room.game_no === r.game_no){
    const pr = prev.room;
    if(r.history.length > pr.history.length) S.queue.push({ type:'vote', h: r.history[r.history.length-1] });
    if(r.quest_results.length > pr.quest_results.length) S.queue.push({ type:'quest', q: r.quest_results[r.quest_results.length-1] });
    if(r.lady_log.length > pr.lady_log.length) S.queue.push({ type:'lady', l: r.lady_log[r.lady_log.length-1] });
  }
  if(!S.modal && S.queue.length){ S.modal = S.queue.shift(); }
}
function closeModal(){
  S.modal = S.queue.length ? S.queue.shift() : null;
  renderModal();
}

}

function seatIssue(ps, n){
  if(n < 5) return '';
  const missing = ps.filter(p => !p.claimed).map(p => p.name);
  if(missing.length) return '还没选座位号：' + missing.map(esc).join('、');
  const bad = ps.filter(p => p.claimed > n);
  if(bad.length) return `现在 ${n} 个人，座位号只能是 1 到 ${n}。请 ${bad.map(p => esc(p.name)).join('、')} 重新选。`;
  return '';
}
function composition(n, s){
  const ev = EVIL_COUNT[n];
  if(!ev) return null;
  const good = ['merlin'], evil = ['assassin'];
  if(s.percival) good.push('percival');
  if(s.morgana) evil.push('morgana');
  if(s.mordred) evil.push('mordred');
  if(s.oberon) evil.push('oberon');
  if(evil.length > ev) return { error:`${n} 人局只有 ${ev} 个坏人（含刺客），特殊坏人选多了`, good, evil };
  while(good.length < n - ev) good.push('servant');
  while(evil.length < ev) evil.push('minion');
  return { good, evil };
}
function roleChips(list){
  const counts = {};
  list.forEach(r => counts[r] = (counts[r] || 0) + 1);
  return Object.keys(counts).map(r =>
    `<span class="chip ${ROLES[r].side}">${ROLES[r].name}${counts[r] > 1 ? ' ×' + counts[r] : ''}</span>`).join('');
}

function seatPickHtml(){
  const ps = players(), me = meInfo(), n = Math.max(ps.length, 5);

    const num = k + 1, owner = ps.find(p => p.claimed === num);
    const cls = owner ? (owner.seat === me.seat ? 'mine' : 'taken') : 'free';
    return `<button class="${cls}" data-act="claim" data-n="${num}" ${owner && owner.seat !== me.seat ? 'disabled' : ''}>
      <span class="n">${num}</span><span class="who">${owner ? esc(owner.name) : '空'}</span></button>`;
  }).join('');
  return `<div class="seatpick">${cells}</div>
    <p class="small muted center" style="margin:10px 0 0">${mine ? `你是 <b>${mine} 号</b>，再点一次可以取消` : '你还没选座位号'}</p>`;
}

        <p>不要让别人看到你的屏幕。${good ? '你是好人，只能出「成功」。' : '你是坏人，可以选择「成功」或「失败」。'}</p>
        ${needTwo ? `<div class="tip" style="margin-top:8px">本任务需要 <b>2 张失败牌</b> 才会失败。</div>` : ''}
        <div class="bigchoice" style="margin-top:12px">
          <button class="btn blue qcard" data-act="play" data-v="1" ${S.busy ? 'disabled' : ''}>${I.spark}成功<small>任务成功</small></button>
          <button class="btn red qcard" data-act="play" data-v="0" ${good || S.busy ? 'disabled' : ''}>${I.boom}失败<small>${good ? '好人不能出' : '破坏任务'}</small></button>
        </div>`;
    }
    return `
      <div class="kicker">第 ${q} 个任务 · 执行任务</div>
      <h2 class="fun">队员正在秘密出牌</h2>
      <p>队员：${names(r.team)}</p>
      <p style="margin-top:6px">${inTeam ? '你已经出牌了，' : ''}已出 ${played}/${r.team.length}<span class="dots"></span></p>
      ${needTwo ? `<div class="tip" style="margin-top:8px">本任务需要 <b>2 张失败牌</b> 才会失败。</div>` : ''}`;
  }
  if(r.phase === 'lady'){
    const holder = r.lady_holder;
    if(me.seat === holder){
      return `
        <div class="kicker">湖中仙女</div>
        <h2 class="fun"><span class="ico">${ICON.lady()}</span>选择一名玩家查验阵营</h2>
        <p><b>点下面的座位</b>选一个人。只有你会看到他是好人还是坏人。之前拿过湖中仙女的人不能被查验。</p>
        <p class="small muted" style="margin-top:4px">查验完，湖中仙女交给被查验的人。你可以如实公布结果，也可以撒谎。</p>`;
    }
    return `
      <div class="kicker">湖中仙女</div>
      <h2 class="fun"><span class="ico">${ICON.lady()}</span>${nm(holder)} 正在查验</h2>
      <p>湖中仙女持有者正在选择一名玩家查看阵营，请稍等<span class="dots"></span></p>`;
  }
  if(r.phase === 'assassin'){
    if(me.role === 'assassin'){
      return `
        <div class="kicker">最后的机会</div>
        <h2 class="fun">${I.sword}刺客，指认梅林</h2>
        <p>好人完成了 3 个任务！坏人现在<b>亮明身份</b>，可以一起讨论。由你<b>点下面的座位</b>做最终选择——找到梅林，坏人就赢。</p>`;
    }
    return `
      <div class="kicker">最后的机会</div>
      <h2 class="fun">${I.sword}刺客正在寻找梅林</h2>
      <p>好人完成了 3 个任务！坏人（红色座位）现在亮明身份，可以公开讨论谁是梅林，由刺客做最终指认。好人请保持沉默。</p>`;
  }
  return '';
}

function seatView(p){
  const r = room(), me = meInfo();
  const isMe = p.seat === me.seat;
  const badges = [];
  if(r.leader === p.seat && r.phase !== 'assassin' && r.status === 'playing') badges.push(`<span title="队长">${ICON.crown}</span>`);
  if(r.lady_enabled && r.lady_holder === p.seat && r.status === 'playing') badges.push(`<span title="湖中仙女">${ICON.lady()}</span>`);
  let cls = 'seat', st = '', clickable = false, act = '';
  const inTeam = r.team.includes(p.seat);
  if(r.phase === 'team_build' && me.seat === r.leader){
    clickable = true; act = 'pick';
    if(S.pick.includes(p.seat)) cls += ' pick';
  } else if(inTeam){ cls += ' team'; }
  if(r.phase === 'team_vote') st = p.voted ? '<div class="st yes">已投票</div>' : '<div class="st wait">未投</div>';
  if(r.phase === 'quest' && inTeam) st = p.played ? '<div class="st yes">已出牌</div>' : '<div class="st wait">出牌中</div>';
  if(r.phase === 'lady' && me.seat === r.lady_holder){
    if(p.seat === me.seat || r.lady_previous.includes(p.seat)) cls += ' dim';
    else { clickable = true; act = 'lady'; }
  }
  if(r.phase === 'assassin'){
    if(p.evil) cls += ' evil';
    if(p.evil) st = `<div class="st" style="color:var(--evil)">${p.assassin ? '刺客' : '坏人'}</div>`;
    if(me.role === 'assassin'){
      if(p.evil || isMe) cls += ' dim'; else { clickable = true; act = 'kill'; }
    }
  }
  if(isMe && !cls.includes('pick')) cls += ' me';
  if(clickable) cls += ' pickable';
  return `<div class="${cls}" ${clickable ? `data-act="${act}" data-seat="${p.seat}" role="button"` : ''}>
    <span class="no">${p.seat + 1}</span>
    ${badges.length ? `<span class="badges">${badges.join('')}</span>` : ''}
    <div class="av">${avatarSvg(p.avatar)}</div>
    <div class="nm">${esc(p.name)}${isMe ? '（我）' : ''}</div>
    ${st}
  </div>`;
}

function viewGame(){
  const r = room(), me = meInfo();
  if(r.status === 'ended') return viewEnd();
  const q = r.quest_no;
  const keyNow = `${r.game_no}-${q}-${r.reject_count}`;
  if(S.pickKey !== keyNow){ S.pick = []; S.pickKey = keyNow; }
  const track = r.sizes.map((sz, i) => {
    const res = r.quest_results[i];
    const cls = res ? (res.success ? 'ok' : 'bad') : (i + 1 === q && r.phase !== 'assassin' ? 'cur' : '');
    return `<div class="qt ${cls}">${res ? (res.success ? '✓' : '✗') : sz}<small>${res ? (res.success ? '成功' : res.fails + '张败') : '第' + (i+1) + '轮'}</small>${r.fails_needed[i] === 2 ? '<span class="two">需2败</span>' : ''}</div>`;
  }).join('');
  const rejects = Array.from({length:5}, (_, i) => `<i class="${i < r.reject_count ? 'on' : ''} ${i === 4 ? 'last' : ''}"></i>`).join('');
  const role = ROLES[me.role] || null;
  return `
  <div class="navbar">
    <span class="logo">Avalon</span>
    <span class="chip gold"><span class="code">${esc(r.code)}</span></span>
    <div class="grow"></div>
    <button class="btn small white" data-act="history">${I.scroll}记录</button>
    <button class="btn small white" data-act="rules" aria-label="规则">${I.book}</button>
  </div>
  <div class="card">
    <div class="track">${track}</div>
    <div class="rejects">连续否决 ${rejects} <span>${r.reject_count}/5</span></div>
  </div>
  <div class="card step" style="margin-top:16px">${phaseView()}</div>
  <div class="seats" style="margin-top:20px">${players().map(seatView).join('')}</div>
  <p class="small muted center" style="margin-top:12px">座位按顺时针排列，队长按 1→2→3… 的顺序轮换。</p>
  <div class="mebar"><div class="in">
    <span class="av">${avatarSvg(players().find(p => p.seat === me.seat)?.avatar)}</span>
    <div class="grow"><b>${esc(me.name)}</b><div class="small muted">${me.seat + 1} 号位</div></div>
    <button class="btn blue" data-act="myrole">${I.lock}查看我的身份</button>
  </div></div>`;
}

function endReason(r){
  const t = r.assassin_target;
  return {
    three_fails: '三个任务失败了，坏人获胜。',
    five_rejects: '连续 5 次组队被否决，坏人获胜。',
    merlin_killed: `刺客指认了 <b>${nm(t)}</b>——正是梅林！坏人反败为胜。`,
    merlin_safe: `刺客指认了 <b>${nm(t)}</b>，但他不是梅林。好人获胜！`
  }[r.end_reason] || '';
}
function viewEnd(){
  const r = room(), me = meInfo();
  const goodWin = r.winner === 'good';
  const iWon = (me.side === r.winner);
  const ps = players();
  return `
  <div class="navbar">
    <span class="logo">Avalon</span>
    <span class="chip gold"><span class="code">${esc(r.code)}</span></span>
    <div class="grow"></div>
    <button class="btn small white" data-act="history">${I.scroll}记录</button>
  </div>
  <div class="endbanner ${goodWin ? 'good' : 'evil'}">
    <div style="width:130px;margin:0 auto">${goodWin ? ART.merlin() : ART.assassin()}</div>
    <h1 class="fun">${goodWin ? '好人胜利！' : '坏人胜利！'}</h1>
    <p style="margin:6px 0 0">${endReason(r)}</p>
    <p class="fun" style="margin:8px 0 0;font-size:20px">${iWon ? I.spark + '你赢了' : '下次加油'}</p>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 class="fun" style="margin-bottom:10px">身份揭晓</h3>
    <div class="rolesgrid">${ps.map(p => {
      const ro = ROLES[p.role] || { name:'?', side:'' };
      return `<div class="rc ${ro.side}"><div class="av">${(ART[p.role] || ART.unknown)()}</div>
        <div class="small"><b>${esc(p.name)}</b></div><div class="small">${ro.name}</div>
        ${r.assassin_target === p.seat ? '<span class="chip evil">被刺杀</span>' : ''}</div>`;

  </div>
  <div class="stack" style="margin-top:18px">

    <button class="btn block white" data-act="leave">离开房间</button>

/* ---------- 弹窗 ---------- */
function roleCard(open){
  const me = meInfo(), ro = ROLES[me.role];
  if(!ro) return '';
  const sees = me.sees || [];
  let know = '';
  if(me.role === 'merlin') know = sees.length
    ? `<p><b>你看到的坏人：</b></p><ul class="knows">${sees.map(x => `<li><span class="chip evil">坏人</span> ${x.seat+1} 号 ${nm(x.seat)}</li>`).join('')}</ul>${room().settings.mordred ? '<p class="small muted">莫德雷德也在场，但你看不到他。</p>' : ''}`
    : '<p>你没看到任何坏人（他们都藏起来了）。</p>';
  else if(me.role === 'percival') know = `<p><b>${sees.length > 1 ? '其中一位是梅林，另一位是莫甘娜：' : '梅林是：'}</b></p><ul class="knows">${sees.map(x => `<li><span class="chip good">${sees.length > 1 ? '梅林？' : '梅林'}</span> ${x.seat+1} 号 ${nm(x.seat)}</li>`).join('')}</ul>`;
  else if(me.role === 'oberon') know = '<p>你看不到其他坏人，他们也看不到你。</p>';
  else if(ro.side === 'evil') know = sees.length
    ? `<p><b>你的坏人同伴：</b></p><ul class="knows">${sees.map(x => `<li><span class="chip evil">同伴</span> ${x.seat+1} 号 ${nm(x.seat)}</li>`).join('')}</ul>${room().settings.oberon ? '<p class="small muted">奥伯伦也是坏人，但你不知道是谁。</p>' : ''}`
    : '<p>你没有看到同伴。</p>';
  else know = '<p class="muted">你没有额外信息，靠观察和推理吧。</p>';
  return `
  <div class="flip ${open ? 'open' : ''}" data-act="flip">
    <div class="inner">
      <div class="face back"><div class="seal fun">?</div><p class="fun" style="font-size:22px;margin:16px 0 4px">点击翻开身份</p><p class="small" style="margin:0;opacity:.85">确认旁边没人偷看</p></div>
      <div class="face front ${ro.side}">
        <div class="rolebig">${ART[me.role]()}</div>
        <h2 class="fun" style="margin-top:4px">${ro.name}</h2>
        <span class="chip ${ro.side}">${SIDE_NAME[ro.side]}</span>
        <p class="small" style="margin:10px 0 0">${ro.desc}</p>
        <div style="width:100%;text-align:left;margin-top:8px;border-top:2px dashed var(--muted);padding-top:8px">${know}</div>
      </div>
    </div>
  </div>`;
}

function renderModal(){
  const m = S.modal;
  if(!m){ $modal.innerHTML = ''; return; }
  let body = '';
  const r = room();
  if(m.type === 'night'){
    body = `
      <h2 class="fun">${I.moon}第 ${r.game_no} 局开始</h2>
      <p class="center small muted" style="margin:6px 0 12px">不用闭眼！每个人在自己手机上偷偷看身份，看完点「我记住了」。</p>
      ${roleCard(!!m.open)}
      <button class="btn block blue" style="margin-top:16px" data-act="close">我记住了</button>`;
  } else if(m.type === 'myrole'){
    body = `${roleCard(!!m.open)}<button class="btn block white" style="margin-top:16px" data-act="close">收起</button>`;
  } else if(m.type === 'vote'){
    const h = m.h, yes = h.votes.filter(Boolean).length;
    body = `
      <h2 class="fun">${h.approved ? I.ok + '组队通过' : I.no + '组队被否决'}</h2>
      <p class="center">第 ${h.quest} 个任务 · 队长 ${nm(h.leader)}<br>队伍：${names(h.team)}</p>
      <p class="center"><span class="chip green">同意 ${yes}</span> <span class="chip evil">反对 ${h.votes.length - yes}</span></p>
      <div class="vlist">${h.votes.map((v, i) => `<div><span>${i+1}. ${nm(i)}</span><span class="chip ${v ? 'green' : 'evil'}">${v ? '同意' : '反对'}</span></div>`).join('')}</div>
      <p class="center small muted" style="margin-top:10px">${h.approved ? '队员接下来秘密出任务牌。' : (r.status === 'ended' ? '' : `队长交给下一位：${nm(r.leader)}。`)}</p>
      <button class="btn block" style="margin-top:12px" data-act="close">知道了</button>`;
  } else if(m.type === 'quest'){
    const q = m.q, total = q.team.length;
    const cards = Array.from({length: total}, (_, i) => i < total - q.fails ? 's' : 'f');
    for(let i = cards.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
    body = `
      <h2 class="fun">${q.success ? I.spark + '任务成功' : I.boom + '任务失败'}</h2>
      <p class="center">第 ${q.quest} 个任务 · 队员：${names(q.team)}</p>
      <div class="qcards">${cards.map((c, i) => `<div class="qc ${c}" style="animation-delay:${i*0.25}s">${c === 's' ? '成功' : '失败'}</div>`).join('')}</div>
      <p class="center"><b>${q.fails}</b> 张失败牌${q.needed === 2 ? '（本任务需 2 张才失败）' : ''}</p>
      <button class="btn block" style="margin-top:12px" data-act="close">知道了</button>`;
  } else if(m.type === 'lady'){
    const l = m.l, mine = l.loyalty;
    body = mine ? `
      <h2 class="fun"><span class="ico">${ICON.lady()}</span>查验结果</h2>
      <div style="width:120px;margin:10px auto">${avatarSvg(P(l.target)?.avatar)}</div>
      <p class="center" style="font-size:20px"><b>${nm(l.target)}</b> 是 <span class="chip ${mine}" style="font-size:18px">${mine === 'good' ? '好人' : '坏人'}</span></p>
      <p class="center small muted">只有你知道这个结果。你可以如实告诉大家，也可以撒谎。湖中仙女已经交给 ${nm(l.target)}。</p>
      <button class="btn block" style="margin-top:12px" data-act="close">知道了</button>`
    : `
      <h2 class="fun"><span class="ico">${ICON.lady()}</span>湖中仙女</h2>
      <p class="center">${nm(l.holder)} 查验了 ${nm(l.target)} 的阵营。<br>只有 ${nm(l.holder)} 知道结果，听听他怎么说吧。</p>
      <button class="btn block" style="margin-top:12px" data-act="close">知道了</button>`;
  } else if(m.type === 'history'){
    const rl = (r.settings && r.settings.roles) || [];
    body = `<h2 class="fun">${I.scroll}本局记录</h2>${rl.length ? `<p class="center small" style="margin:6px 0 0">本局角色</p><div class="comp" style="justify-content:center;margin-top:4px">${roleChips(rl)}</div>` : ''}${historyHtml()}<button class="btn block white" style="margin-top:12px" data-act="close">关闭</button>`;
  } else if(m.type === 'rules'){
    body = rulesHtml() + `<button class="btn block white" style="margin-top:12px" data-act="close">关闭</button>`;
  }
  $modal.innerHTML = `<div class="mask" data-act="maskclose"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}

function historyHtml(){
  const r = room();
  if(!r || !r.history.length) return '<p class="center muted">还没有记录。</p>';
  let html = '';
  for(let q = 1; q <= 5; q++){
    const hs = r.history.filter(h => h.quest === q);
    if(!hs.length) continue;
    const res = r.quest_results.find(x => x.quest === q);
    html += `<div class="card" style="margin-top:10px;padding:12px"><div class="row"><b class="fun grow">第 ${q} 个任务</b>${res ? `<span class="chip ${res.success ? 'good' : 'evil'}">${res.success ? '成功' : '失败'} · ${res.fails} 张败</span>` : ''}</div>`;
    hs.forEach(h => {
      html += `<div class="hist"><div class="h">${h.attempt}. 队长 ${nm(h.leader)} → ${names(h.team)} <span class="chip ${h.approved ? 'green' : 'evil'}">${h.approved ? '通过' : '否决'}</span></div>
        <div class="small muted">同意：${h.votes.map((v, i) => v ? nm(i) : null).filter(Boolean).join('、') || '无'}<br>反对：${h.votes.map((v, i) => !v ? nm(i) : null).filter(Boolean).join('、') || '无'}</div></div>`;
    });
    r.lady_log.filter(l => l.quest === q).forEach(l => {
      html += `<div class="hist small"><span class="ico">${ICON.lady()}</span>${nm(l.holder)} 查验了 ${nm(l.target)}${l.loyalty ? `：<span class="chip ${l.loyalty}">${l.loyalty === 'good' ? '好人' : '坏人'}</span>` : ''}</div>`;
    });
    html += `</div>`;
  }
  return html;
}

  <p>好人完成 3 个任务后，坏人亮明身份一起讨论，由刺客指认一名好人。指中梅林，坏人获胜；否则好人获胜。</p>
  <h3>湖中仙女（可选，7 人以上）</h3>
  <p>开局交给第一位队长右手边的玩家。第 2、3、4 个任务结束后，持有者查验一名玩家的阵营（只有他知道结果，可以说谎），然后把湖中仙女交给被查验者。拿过湖中仙女的人不能被查验。</p>
  </div>`;
}

/* ---------- 测试模式 ---------- */
function testBar(){
  if(!S.test || !S.state) return '';
  const r = room(), ps = players(), cur = S.session.token;
  const byName = n => S.ids.find(x => x.name === n);
  const seatId = seat => { const p = P(seat); return p ? byName(p.name) : null; };
  let actor = null, actorWhy = '';
  if(r.phase === 'team_build'){ actor = seatId(r.leader); actorWhy = '队长'; }
  if(r.phase === 'lady'){ actor = seatId(r.lady_holder); actorWhy = '湖中仙女'; }
  if(r.phase === 'assassin'){ const a = ps.find(p => p.assassin); actor = a ? byName(a.name) : null; actorWhy = '刺客'; }
  const acts = [];
  if(r.status === 'lobby'){
    if(ps.length < 10) acts.push(`<button data-act="taddone">+ 加 1 个假玩家</button>`);
    if(ps.length < 5) acts.push(`<button data-act="taddfill">补满 5 人</button>`);
    acts.push(`<button data-act="tseats">一键分配座位号</button>`);
  }
  if(r.phase === 'team_vote'){
    acts.push(`<button data-act="tvote" data-v="1">其他人都投同意</button>`);
    acts.push(`<button data-act="tvote" data-v="0">其他人都投反对</button>`);
  }
  if(r.phase === 'quest') acts.push(`<button data-act="tplay">其他队员都出成功</button>`);
  if(actor && actor.token !== cur) acts.push(`<button data-act="tswitch" data-t="${actor.token}">切到${actorWhy}（${esc(actor.name)}）</button>`);
  return `<div class="testbar">
    <div class="row"><b class="grow" style="color:#fff">${I.flask}测试模式 · 现在操作的是：${esc(meInfo().name)}</b></div>
    <div class="ids">${S.ids.map(x => `<button class="${x.token === cur ? 'on' : ''}" data-act="tswitch" data-t="${x.token}">${esc(x.name)}</button>`).join('')}</div>
    ${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}
  </div>`;
}
function saveIds(){ store.set('avalon_test_ids', S.ids); }
function rememberMain(){
  if(S.test && S.session && !S.ids.find(x => x.token === S.session.token)){
    S.ids.unshift({ name: S.me.name, token: S.session.token }); saveIds();
  }
}
async function addFake(){
  const used = new Set(players().map(p => p.name).concat(S.ids.map(x => x.name)));
  let k = 1; while(used.has('测试' + k)) k++;
  const out = await rpc('avalon_join', { p_code: room().code, p_name: '测试' + k, p_avatar: (k * 5) % 12 });
  S.ids.push({ name: '测试' + k, token: out.token }); saveIds();
}
async function others(fn, argsFor){
  const cur = S.session.token;
  for(const x of S.ids){ if(x.token === cur) continue; try{ await rpc(fn, argsFor(x)); }catch(e){} }
}
async function tbusy(job){
  if(S.busy) return; S.busy = true; render();
  try{ await job(); }catch(e){ toast(e.message); }
  S.busy = false; await refresh(true);
}

/* ---------- 确认框 ---------- */
let pendingConfirm = null;
function ask(msg, okLabel, fn, danger){ pendingConfirm = { msg, okLabel, fn, danger }; renderConfirm(); }
function renderConfirm(){
  const el = document.getElementById('confirm');
  if(!pendingConfirm){ el.innerHTML = ''; return; }
  const c = pendingConfirm;
  el.innerHTML = `<div class="mask" style="z-index:30;align-items:center"><div class="sheet" style="border-radius:26px;max-width:400px;margin:16px">
    <p class="center" style="font-size:20px;margin:6px 0 18px">${esc(c.msg)}</p>
    <div class="row"><button class="btn white grow" data-act="cfno">取消</button>
    <button class="btn ${c.danger ? 'red' : 'blue'} grow" data-act="cfyes">${esc(c.okLabel)}</button></div>
  </div></div>`;
}

/* ---------- 交互 ---------- */
function readInputs(){
  const ni = document.getElementById('nameInput'); if(ni) S.me.name = ni.value.trim();
  const ci = document.getElementById('codeInput'); if(ci) S.joinCode = ci.value.replace(/[^0-9]/g, '');
  store.set('avalon_me', S.me);
}
function enterRoom(out){
  S.session = { code: out.code, token: out.token };
  store.set('avalon_session', S.session);
  S.ids = []; saveIds(); rememberMain();
  S.state = null; S.sig = '';
}
const actions = {
  avatar(d){ readInputs(); S.me.avatar = +d.i; store.set('avalon_me', S.me); render(); },
  create(){
    readInputs();
    if(!S.me.name){ toast('先填一下你的名字'); return; }
    act('avalon_create_room', { p_name: S.me.name, p_avatar: S.me.avatar }, enterRoom);
  },
  join(){
    readInputs();
    if(!S.me.name){ toast('先填一下你的名字'); return; }
    if(S.joinCode.length !== 4){ toast('房间号是 4 位数字'); return; }
    act('avalon_join', { p_code: S.joinCode, p_name: S.me.name, p_avatar: S.me.avatar }, enterRoom);
  },
  leave(){
    const me = meInfo();
    const isEnded = room() && room().status === 'ended';
    const msg = me && me.host && !isEnded ? '你是房主，离开会解散整个房间。确定吗？' : '确定离开房间吗？';
    ask(msg, me && me.host && !isEnded ? '解散并离开' : '离开', async () => {
      const token = S.session && S.session.token;
      const canRemove = me && room() && room().status !== 'playing';
      leaveLocal();
      if(token && canRemove){ try{ await rpc('avalon_remove', { p_token: token, p_seat: me.seat }); }catch(e){} }
    }, true);
  },
  claim(d){
    const num = +d.n, mine = (players().find(p => p.seat === meInfo().seat) || {}).claimed;
    act('avalon_claim_seat', { p_token: S.session.token, p_num: mine === num ? null : num });
  },
  cfno(){ pendingConfirm = null; renderConfirm(); },
  testmode(){ readInputs(); S.test = !S.test; store.set('avalon_test', S.test); render(); toast(S.test ? '测试模式已开启：创建房间后可以加假玩家' : '测试模式已关闭'); },
  taddone(){ tbusy(addFake); },
  taddfill(){ tbusy(async () => { const need = 5 - players().length; for(let i = 0; i < need; i++) await addFake(); }); },
  tseats(){ tbusy(async () => {
    for(const x of S.ids){ try{ await rpc('avalon_claim_seat', { p_token: x.token, p_num: null }); }catch(e){} }
    let i = 0; for(const x of S.ids){ i++; try{ await rpc('avalon_claim_seat', { p_token: x.token, p_num: i }); }catch(e){} }
  }); },
  tvote(d){ tbusy(() => others('avalon_vote', x => ({ p_token: x.token, p_approve: d.v === '1' }))); },
  tplay(){ tbusy(() => others('avalon_quest_play', x => ({ p_token: x.token, p_success: true }))); },
  tswitch(d){
    if(d.t === S.session.token) return;
    S.session = { code: room().code, token: d.t }; store.set('avalon_session', S.session);
    S.state = null; S.sig = ''; S.queue = []; S.modal = null; S.pick = []; S.pickKey = '';
    render(); refresh(true);
  },
  cfyes(){ const f = pendingConfirm && pendingConfirm.fn; pendingConfirm = null; renderConfirm(); if(f) f(); },
  share(){
    const url = location.origin + location.pathname + '?room=' + room().code;
    if(navigator.share) navigator.share({ title:'Avalon', text:`来玩 Avalon！房间号 ${room().code}`, url }).catch(() => {});
    else if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('链接已复制'), () => toast(url));
    else toast(url);
  },
  kick(d){
    const p = P(+d.seat);
    ask(`把 ${p ? p.name : ''} 移出房间？`, '移出', () => act('avalon_remove', { p_token: S.session.token, p_seat: +d.seat }), true);
  },
  set(d){
    if(!meInfo().host) return;
    S.settings[d.k] = !S.settings[d.k];
    store.set('avalon_settings', S.settings); render();
  },
  rec(){
    const n = players().length;
    if(!REC[n]) return;
    Object.assign(S.settings, REC[n]);
    store.set('avalon_settings', S.settings); render();
    toast('已按 ' + n + ' 人局常用配置设置');
  },
  start(){
    act('avalon_start', { p_token: S.session.token, p_settings: { ...S.settings, lady: S.settings.lady && players().length >= 7 } });
  },
  pick(d){
    const seat = +d.seat, size = room().sizes[room().quest_no - 1];
    const i = S.pick.indexOf(seat);
    if(i >= 0) S.pick.splice(i, 1);
    else if(S.pick.length < size) S.pick.push(seat);
    else toast(`这个任务只需要 ${size} 人，先取消一个`);
    render();
  },
  propose(){ act('avalon_propose', { p_token: S.session.token, p_team: S.pick }); },
  vote(d){ act('avalon_vote', { p_token: S.session.token, p_approve: d.v === '1' }); },
  play(d){
    const go = () => act('avalon_quest_play', { p_token: S.session.token, p_success: d.v === '1' });
    if(d.v === '0') ask('确定出「失败」牌吗？', '出失败牌', go, true); else go();
  },
  lady(d){
    const p = P(+d.seat);
    ask(`查验 ${p ? p.name : ''} 的阵营？`, '查验', () => act('avalon_lady', { p_token: S.session.token, p_target: +d.seat }));
  },
  kill(d){
    const p = P(+d.seat);
    ask(`最终指认 ${p ? p.name : ''} 是梅林？这个决定不能撤回。`, '刺杀', () => act('avalon_assassinate', { p_token: S.session.token, p_target: +d.seat }), true);
  },
  again(){ act('avalon_back_to_lobby', { p_token: S.session.token }); },
  myrole(){ S.modal = { type:'myrole', open:false }; renderModal(); },
  flip(){ if(S.modal){ S.modal.open = !S.modal.open; const f = document.querySelector('.flip'); if(f) f.classList.toggle('open', S.modal.open); } },
  history(){ S.modal = { type:'history' }; renderModal(); },
  rules(){ readInputs(); S.modal = { type:'rules' }; renderModal(); },
  close(){ closeModal(); },
  maskclose(d, el, e){ if(e.target === el && S.modal && S.modal.type !== 'night') closeModal(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = actions[el.dataset.act];
  if(fn) fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'codeInput') actions.join();
});
document.addEventListener('input', e => {
  if(e.target.id === 'codeInput') e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
});

/* ---------- 启动 ---------- */
(function init(){
  const q = new URLSearchParams(location.search).get('room');
  if(q) S.joinCode = q.replace(/[^0-9]/g, '').slice(0, 4);
  render();
  if(S.session) refresh(true);
})();
</script>
</body>
</html>
